name: Update encoding lane registry

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/generate_lanes.py

      - name: Commit registry when changed
        shell: bash
        run: |
          if git diff --quiet -- LANES.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LANES.md
          git commit -m "chore: update encoding lane registry"
          git push

      # Optional push-sync to Slack: uncomment after adding the SLACK_LANES_WEBHOOK secret.
      # - name: Notify Slack on change
      #   if: steps.commit.outputs.changed == 'true'
