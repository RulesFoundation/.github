name: Validate RuleSpec Repository

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version used for repository tests and validators.
        required: false
        type: string
        default: "3.13"
      axiom-encode-ref:
        description: Git ref for TheAxiomFoundation/axiom-encode.
        required: false
        type: string
        default: main
      axiom-rules-ref:
        description: Git ref for TheAxiomFoundation/axiom-rules.
        required: false
        type: string
        default: main
      validate-roots:
        description: Space-separated repository roots containing RuleSpec YAML.
        required: false
        type: string
        default: "statutes regulations policies"
      run-pytest:
        description: Whether to run pytest when the repository has a tests directory.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout rules repository
        uses: actions/checkout@v6.0.2

      - name: Checkout axiom-encode
        uses: actions/checkout@v6.0.2
        with:
          repository: TheAxiomFoundation/axiom-encode
          ref: ${{ inputs.axiom-encode-ref }}
          path: _axiom/axiom-encode

      - name: Checkout axiom-rules
        uses: actions/checkout@v6.0.2
        with:
          repository: TheAxiomFoundation/axiom-rules
          ref: ${{ inputs.axiom-rules-ref }}
          path: _axiom/axiom-rules

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache axiom-rules build
        uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: _axiom/axiom-rules

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml
          python -m pip install -e _axiom/axiom-encode

      - name: Build axiom-rules
        working-directory: _axiom/axiom-rules
        run: cargo build --verbose

      - name: Link axiom-rules as sibling checkout
        run: |
          ln -sfn "$GITHUB_WORKSPACE/_axiom/axiom-rules" "$GITHUB_WORKSPACE/../axiom-rules"

      - name: Run repository tests
        if: ${{ inputs.run-pytest }}
        run: |
          if [ -d tests ] && find tests -type f \( -name "test_*.py" -o -name "*_test.py" \) | grep -q .; then
            python -m pytest -q tests
          else
            echo "No Python tests found; skipping pytest."
          fi

      - name: Reject obsolete generated files
        run: |
          obsolete_ext="r""ac"
          matches="$(find . \
            \( -path ./.git -o -path ./_axiom -o -path ./.venv -o -path ./.pytest_cache \) -prune \
            -o \( -name "*.${obsolete_ext}" -o -name "*.${obsolete_ext}.test" \) -print)"
          if [ -n "$matches" ]; then
            printf '%s\n' "$matches" >&2
            exit 1
          fi

      - name: Reject disallowed repository layout
        shell: bash
        run: |
          set -euo pipefail

          disallowed=()

          for root in statute regulation policy; do
            if [ -e "$root" ]; then
              disallowed+=("$root/")
            fi
          done

          while IFS= read -r path; do
            disallowed+=("$path")
          done < <(
            find . \
              \( -path ./.git -o -path ./_axiom -o -path ./.venv -o -path ./.pytest_cache \) -prune \
              -o -type f \( -name "parameters.yaml" -o -name "tests.yaml" \) -print
          )

          while IFS= read -r path; do
            disallowed+=("$path")
          done < <(
            find tests -type f -name "*.yaml" 2>/dev/null || true
          )

          while IFS= read -r path; do
            disallowed+=("$path")
          done < <(
            find . \
              \( -path ./.git -o -path ./_axiom -o -path ./.venv -o -path ./.pytest_cache \
                 -o -path ./.github -o -path ./statutes -o -path ./regulations \
                 -o -path ./policies -o -path ./sources \) -prune \
              -o -type f \( -name "*.yaml" -o -name "*.yml" \) -print
          )

          if [ "${#disallowed[@]}" -ne 0 ]; then
            printf 'Repository layout is not allowed. Use RuleSpec YAML under statutes/, regulations/, or policies/.\n' >&2
            printf '%s\n' "${disallowed[@]}" >&2
            exit 1
          fi

      - name: Validate RuleSpec YAML
        shell: bash
        env:
          VALIDATE_ROOTS: ${{ inputs.validate-roots }}
        run: |
          set -euo pipefail

          mapfile -t rulespec_files < <(
            for root in $VALIDATE_ROOTS; do
              if [ -d "$root" ]; then
                find "$root" -type f -name "*.yaml" ! -name "*.test.yaml"
              fi
            done | sort
          )

          if [ "${#rulespec_files[@]}" -eq 0 ]; then
            echo "No RuleSpec YAML files found under: $VALIDATE_ROOTS"
            exit 0
          fi

          for file in "${rulespec_files[@]}"; do
            axiom-encode validate "$GITHUB_WORKSPACE/$file" --skip-reviewers
          done
