name: Validate RuleSpec Repository

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version used for repository tests and validators.
        required: false
        type: string
        default: "3.14"
      axiom-encode-ref:
        description: Full commit SHA for TheAxiomFoundation/axiom-encode.
        required: true
        type: string
      axiom-rules-engine-ref:
        description: Full commit SHA for TheAxiomFoundation/axiom-rules-engine.
        required: true
        type: string
      axiom-corpus-ref:
        description: Full commit SHA for TheAxiomFoundation/axiom-corpus.
        required: true
        type: string
      rulespec-us-ref:
        description: Full commit SHA for TheAxiomFoundation/rulespec-us canonical targets.
        required: true
        type: string
      corpus-release-base-url:
        description: HTTPS base URL of the public R2 bucket containing releases/.
        # Interim r2.dev URL for the dedicated axiom-corpus-releases bucket;
        # switch to https://corpus.axiom-foundation.org once the custom domain
        # is bound (needs the R2 bucket in the axiom-foundation.org zone account).
        required: false
        default: https://pub-a8952f8657fc49fda358146ac001366c.r2.dev
        type: string
      corpus-release-registry-url:
        description: >-
          Optional HTTPS Supabase project URL whose public corpus.release_objects
          registry is used instead of corpus-release-base-url.
        required: false
        default: ""
        type: string
      corpus-release-registry-anon-key:
        description: >-
          Public Supabase anon key required when corpus-release-registry-url is set.
        required: false
        default: ""
        type: string
      validate-roots:
        description: >-
          Space-separated repository roots containing RuleSpec YAML, or
          "auto" to discover jurisdiction directories in a country monorepo
          (top-level dirs like us/, us-co/ that contain statutes/,
          regulations/, policies/, or legislation/).
        required: false
        type: string
        default: "statutes regulations policies"
      max-shard-modules:
        description: >-
          Maximum RuleSpec modules assigned to one validation shard. Roots
          above this size are split deterministically along subtree boundaries.
        required: false
        type: number
        default: 150
      run-pytest:
        description: Whether to run pytest when the repository has a tests directory.
        required: false
        type: boolean
        default: true
      run-generated-guard:
        description: >-
          Whether to run the manual-RuleSpec-change guard. Disable ONLY for
          history-preserving migration PRs (e.g. repo consolidation) where
          every file arrives from an already-validated repo; re-enable
          immediately after.
        required: false
        type: boolean
        default: true
      guard-programs-root:
        description: >-
          Whether to require encoding manifests on the composed-pilot
          `programs/` root too (encode#1053). Opt-in per repo: enable only
          after every existing `programs/` file has an encoder apply-manifest
          or a manual attestation, otherwise the guard fails on the backlog.
          When true, `programs` is guarded as a RuleSpec root rather than
          merely tolerated as an allowed extra directory.
        required: false
        type: boolean
        default: false
      run-money-atom-check:
        description: >-
          Whether to require a proof atom citing a provision on every
          policy-bearing monetary value (currency parameters, currency
          parameter-table cells, and currency literals in derived formulas).
          The calling repo may carry a `known-missing-money-atoms.yaml`
          ratchet to tolerate a visible backlog; an absent ratchet means a
          strict zero allowance, so a repo must be clean or carry a ratchet.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  shards:
    name: shards
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.compute.outputs.matrix }}
      descriptors: ${{ steps.compute.outputs.descriptors }}
      first: ${{ steps.compute.outputs.first }}
      roots: ${{ steps.compute.outputs.roots }}
      selected-roots: ${{ steps.compute.outputs.selected-roots }}
      max-shard-modules: ${{ steps.compute.outputs.max-shard-modules }}
      allowed-extra: ${{ steps.compute.outputs.allowed-extra }}
    steps:
      - name: Checkout rules repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history so shard-on-demand can diff the pull-request base
          # against the head to see which jurisdiction subtrees changed.
          fetch-depth: 0

      - name: Compute validation shards
        id: compute
        shell: bash
        env:
          VALIDATE_ROOTS_INPUT: ${{ inputs.validate-roots }}
          MAX_SHARD_MODULES: ${{ inputs.max-shard-modules }}
          GUARD_PROGRAMS_ROOT: ${{ inputs.guard-programs-root }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$VALIDATE_ROOTS_INPUT" = "auto" ]; then
            all_shards=()
            for dir in */; do
              dir="${dir%/}"
              case "$dir" in _*|.*) continue ;; esac
              if printf '%s' "$dir" | grep -Eq '^[a-z]{2}(-[a-z0-9-]+)*$'; then
                for marker in statutes regulations policies legislation; do
                  if [ -d "$dir/$marker" ]; then
                    all_shards+=("$dir")
                    break
                  fi
                done
              fi
            done
            if [ "${#all_shards[@]}" -eq 0 ]; then
              echo "validate-roots=auto found no jurisdiction directories" >&2
              exit 1
            fi
            # roots always covers every discovered jurisdiction, even when the
            # matrix is scoped to one jurisdiction: the repo-wide gates (layout,
            # obsolete-file, manual-change guard, money-atom) run on the first
            # shard against this full set, so their whole-repo scope is
            # preserved regardless of which single shard the matrix selects.
            roots="${all_shards[*]}"
            if [ "$GUARD_PROGRAMS_ROOT" = "true" ]; then
              # Guard the composed-pilot programs/ root instead of merely
              # tolerating it as an allowed extra (encode#1053).
              roots="$roots programs"
              allowed_extra="sources"
            else
              allowed_extra="sources programs"
            fi

            # Shard-on-demand: a pull request whose diff is confined to exactly
            # one jurisdiction subtree (the bulk-encoding case) validates only
            # that jurisdiction's shard set. Multi-tree diffs, pushes, scheduled
            # runs, and any change that touches shared infrastructure fall back
            # to the full matrix, which stays the honesty backstop against
            # cross-shard drift (a daily scheduled full run lives in the
            # calling repo). The repo-wide gates still run because they are
            # pinned to the first shard, so no gate is skipped when scoped.
            mapfile -t selected_shards < <(
              ALL_SHARDS="${all_shards[*]}" \
              EVENT_NAME="$EVENT_NAME" \
              PR_BASE_SHA="$PR_BASE_SHA" \
              HEAD_SHA="$HEAD_SHA" \
              python3 -I - <<'PY'
          import os
          import subprocess
          import sys

          all_shards = os.environ["ALL_SHARDS"].split()
          shard_set = set(all_shards)


          def full(reason: str) -> None:
              print(f"scope=full ({reason})", file=sys.stderr)
              for shard in all_shards:
                  print(shard)
              raise SystemExit


          event = os.environ.get("EVENT_NAME", "")
          base = os.environ.get("PR_BASE_SHA", "").strip()
          head = os.environ.get("HEAD_SHA", "").strip()

          if event != "pull_request" or not base or not head:
              full(f"event={event or 'unknown'}")

          diff = subprocess.run(
              ["git", "diff", "--name-only", "--no-renames",
               "--diff-filter=ACMRTD", base, head],
              stdout=subprocess.PIPE, text=True,
          )
          if diff.returncode != 0:
              full("git diff failed")

          changed = [line.strip() for line in diff.stdout.splitlines() if line.strip()]
          if not changed:
              full("empty diff")

          touched: set[str] = set()
          for path in changed:
              top = path.split("/", 1)[0]
              if top in shard_set:
                  touched.add(top)
                  continue
              # The reverse index is derived tooling metadata regenerated from
              # the YAML; it never changes what any shard must validate, so an
              # index-only edit alongside a jurisdiction edit stays scoped.
              if path.startswith(".axiom/index/"):
                  continue
              # Anything else (workflows, toolchain, structure config, other
              # .axiom entries, sources/, programs/, root files, ...) can
              # affect every shard: fall back to the full matrix.
              full(f"cross-cutting path {path}")

          if len(touched) == 1:
              only = next(iter(touched))
              print(f"scope=one-jurisdiction ({only})", file=sys.stderr)
              print(only)
          else:
              full(f"{len(touched)} jurisdiction subtrees touched")
          PY
            )
            # Never emit an empty matrix: if scope selection produced nothing
            # (e.g. the classifier crashed), run the full matrix rather than
            # skip validation, so the required check can never pass vacuously.
            if [ "${#selected_shards[@]}" -eq 0 ]; then
              echo "Scope selection produced no shards; falling back to full matrix." >&2
              selected_shards=("${all_shards[@]}")
            fi
            selected_roots=("${selected_shards[@]}")
          else
            roots="$VALIDATE_ROOTS_INPUT"
            read -r -a selected_roots <<< "$VALIDATE_ROOTS_INPUT"
            if [ "${#selected_roots[@]}" -eq 0 ]; then
              echo "validate-roots must name at least one content root" >&2
              exit 1
            fi
            if [ "$GUARD_PROGRAMS_ROOT" = "true" ]; then
              case " $roots " in
                *" programs "*) : ;;
                *) roots="$roots programs" ;;
              esac
            fi
            allowed_extra="sources"
          fi
          SELECTED_ROOTS="${selected_roots[*]}" \
          ROOTS="$roots" \
          ALLOWED_EXTRA="$allowed_extra" \
          python3 -I - <<'PY'
          import json
          import os
          import sys
          from collections import defaultdict
          from pathlib import Path, PurePosixPath

          try:
              maximum = int(os.environ["MAX_SHARD_MODULES"])
          except ValueError:
              raise SystemExit("max-shard-modules must be a positive integer")
          if maximum <= 0 or str(maximum) != os.environ["MAX_SHARD_MODULES"].strip():
              raise SystemExit("max-shard-modules must be a positive integer")

          selected_roots = os.environ["SELECTED_ROOTS"].split()
          if len(selected_roots) != len(set(selected_roots)):
              raise SystemExit("validate-roots contains a duplicate content root")

          def family(path: PurePosixPath) -> PurePosixPath:
              text = path.as_posix()
              if text.endswith(".test.yaml"):
                  return PurePosixPath(text.removesuffix(".test.yaml") + ".yaml")
              if text.endswith(".test.yml"):
                  return PurePosixPath(text.removesuffix(".test.yml") + ".yml")
              return path

          def discover(root_text: str) -> tuple[set[PurePosixPath], set[PurePosixPath]]:
              root = Path(root_text)
              modules: set[PurePosixPath] = set()
              families: set[PurePosixPath] = set()
              if root.is_symlink():
                  raise SystemExit(f"validation content root must not be a symlink: {root}")
              if not root.is_dir():
                  return modules, families
              for directory, directory_names, file_names in os.walk(root, followlinks=False):
                  directory_names[:] = sorted(
                      name for name in directory_names if name != "programs"
                  )
                  base = Path(directory)
                  for name in sorted(file_names):
                      path = base / name
                      if path.is_symlink() or not path.is_file():
                          continue
                      relative_text = path.relative_to(root).as_posix()
                      if "\n" in relative_text or "\r" in relative_text:
                          raise SystemExit(
                              "validation module paths must not contain CR or LF: "
                              f"{relative_text!r}"
                          )
                      relative = PurePosixPath(relative_text)
                      if "programs" in relative.parts:
                          continue
                      if not (name.endswith(".yaml") or name.endswith(".yml")):
                          continue
                      module_family = family(relative)
                      families.add(module_family)
                      if not (name.endswith(".test.yaml") or name.endswith(".test.yml")):
                          modules.add(relative)
              return modules, families

          def subtree_atoms(
              families: set[PurePosixPath], modules: set[PurePosixPath]
          ) -> list[dict[str, object]]:
              atoms: list[dict[str, object]] = []

              def descend(prefix: tuple[str, ...], members: list[PurePosixPath]) -> None:
                  weight = sum(member in modules for member in members)
                  if weight <= maximum:
                      selector = "/".join(prefix) if prefix else "."
                      atoms.append({"path": selector, "module_count": weight})
                      return

                  direct: list[PurePosixPath] = []
                  children: dict[str, list[PurePosixPath]] = defaultdict(list)
                  for member in members:
                      if len(member.parts) == len(prefix) + 1:
                          direct.append(member)
                      else:
                          children[member.parts[len(prefix)]].append(member)

                  # Exact module-family selectors are the deterministic
                  # fallback for a flat directory that itself exceeds the cap.
                  for member in sorted(direct, key=lambda item: item.as_posix()):
                      atoms.append(
                          {
                              "path": member.as_posix(),
                              "module_count": int(member in modules),
                          }
                      )
                  for child in sorted(children):
                      descend(prefix + (child,), children[child])

              descend((), sorted(families, key=lambda item: item.as_posix()))
              return atoms

          def pack(atoms: list[dict[str, object]]) -> list[list[dict[str, object]]]:
              bins: list[list[dict[str, object]]] = []
              totals: list[int] = []
              ordered = sorted(
                  atoms,
                  key=lambda atom: (-int(atom["module_count"]), str(atom["path"])),
              )
              for atom in ordered:
                  weight = int(atom["module_count"])
                  for index, total in enumerate(totals):
                      if total + weight <= maximum:
                          bins[index].append(atom)
                          totals[index] += weight
                          break
                  else:
                      bins.append([atom])
                      totals.append(weight)
              return bins

          descriptors: list[dict[str, object]] = []
          for root in selected_roots:
              modules, families = discover(root)
              if len(modules) <= maximum:
                  root_bins = [[{"path": ".", "module_count": len(modules)}]]
              else:
                  root_bins = pack(subtree_atoms(families, modules))
                  # The first matrix leg also owns the unchanged repo-wide
                  # gates. Put the lightest deterministic bin there so those
                  # gates overlap the least per-module validation work.
                  root_bins.sort(
                      key=lambda atoms: (
                          sum(int(atom["module_count"]) for atom in atoms),
                          tuple(sorted(str(atom["path"]) for atom in atoms)),
                      )
                  )
              for index, atoms in enumerate(root_bins, start=1):
                  filters = sorted(str(atom["path"]) for atom in atoms)
                  identifier = root
                  if len(root_bins) > 1:
                      identifier = f"{root}:part-{index:02d}"
                  descriptors.append(
                      {
                          "id": identifier,
                          "root": root,
                          "filters": filters,
                          "module_count": sum(int(atom["module_count"]) for atom in atoms),
                      }
                  )

          if not descriptors:
              raise SystemExit("shard computation produced no validation descriptors")
          if len(descriptors) > 256:
              raise SystemExit(
                  f"shard computation produced {len(descriptors)} entries; "
                  "GitHub Actions permits at most 256"
              )
          identifiers = [str(descriptor["id"]) for descriptor in descriptors]
          if len(identifiers) != len(set(identifiers)):
              raise SystemExit("shard computation produced duplicate matrix identifiers")

          compact = {"separators": (",", ":"), "sort_keys": True}
          matrix = json.dumps(identifiers, **compact)
          encoded_descriptors = json.dumps(descriptors, **compact)
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              print(f"matrix={matrix}", file=output)
              print(f"descriptors={encoded_descriptors}", file=output)
              print(f"first={identifiers[0]}", file=output)
              print(f"roots={os.environ['ROOTS']}", file=output)
              print(f"selected-roots={' '.join(selected_roots)}", file=output)
              print(f"max-shard-modules={maximum}", file=output)
              print(f"allowed-extra={os.environ['ALLOWED_EXTRA']}", file=output)
          print("Shards: " + matrix)
          for descriptor in descriptors:
              print(
                  f"- {descriptor['id']}: {descriptor['module_count']} module(s); "
                  + ", ".join(str(item) for item in descriptor["filters"])
              )
          PY

  provision:
    name: provision
    runs-on: ubuntu-latest
    # Do not let an optional centralized checkout/build/upload hold every
    # validation leg behind GitHub's multi-hour default job timeout.
    timeout-minutes: 30
    # The cache is an optimization only. If this centralized attempt has any
    # transient failure, every validation leg runs the original fresh path.
    continue-on-error: true
    outputs:
      cache-ready: ${{ steps.result.outputs.cache-ready }}
      cache-key: ${{ steps.result.outputs.cache-key }}
      manifest-sha256: ${{ steps.result.outputs.manifest-sha256 }}
      python-version: ${{ steps.result.outputs.python-version }}
    steps:
      - name: Initialize same-run cache authority
        id: policy
        shell: bash
        run: |
          set -euo pipefail
          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "Fresh authority will provision one run-scoped validation tree."

      - name: Free runner disk space
        if: ${{ steps.policy.outputs.eligible == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true

      - name: Validate immutable provisioning inputs
        if: ${{ steps.policy.outputs.eligible == 'true' }}
        shell: bash
        env:
          AXIOM_ENCODE_SHA: ${{ inputs.axiom-encode-ref }}
          AXIOM_RULES_ENGINE_SHA: ${{ inputs.axiom-rules-engine-ref }}
          PYTHON_VERSION: ${{ inputs.python-version }}
          TRUST_APPLY_ROOT: ${{ vars.AXIOM_ENCODE_APPLY_SIGNING_PUBLIC_KEY }}
          TRUST_EVAL_ROOT: ${{ vars.AXIOM_ENCODE_EVAL_SIGNING_PUBLIC_KEY }}
          TRUST_CORPUS_RELEASE_ROOT: ${{ vars.AXIOM_CORPUS_RELEASE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          for value in "$AXIOM_ENCODE_SHA" "$AXIOM_RULES_ENGINE_SHA"; do
            if [[ ! "$value" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Provisioning refs must be exact lowercase commit SHAs: $value" >&2
              exit 1
            fi
          done
          if [[ ! "$PYTHON_VERSION" =~ ^3\.[0-9]+$ ]]; then
            echo "python-version must be a bare major.minor like 3.14: $PYTHON_VERSION" >&2
            exit 1
          fi
          test -n "$TRUST_APPLY_ROOT"
          test -n "$TRUST_EVAL_ROOT"
          test -n "$TRUST_CORPUS_RELEASE_ROOT"

      - name: Set up Python
        if: ${{ steps.policy.outputs.eligible == 'true' }}
        id: python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Checkout axiom-encode
        if: ${{ steps.policy.outputs.eligible == 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: TheAxiomFoundation/axiom-encode
          ref: ${{ inputs.axiom-encode-ref }}
          path: _axiom/axiom-encode
          persist-credentials: false

      - name: Checkout axiom-rules-engine
        if: ${{ steps.policy.outputs.eligible == 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: TheAxiomFoundation/axiom-rules-engine
          ref: ${{ inputs.axiom-rules-engine-ref }}
          path: _axiom/axiom-rules-engine
          persist-credentials: false

      - name: Authenticate provisioned dependency commits
        if: ${{ steps.policy.outputs.eligible == 'true' }}
        shell: bash
        env:
          AXIOM_ENCODE_SHA: ${{ inputs.axiom-encode-ref }}
          AXIOM_RULES_ENGINE_SHA: ${{ inputs.axiom-rules-engine-ref }}
        run: |
          set -euo pipefail
          verify_ancestor() {
            local repo="$1" expected="$2" default_branch
            test "$(git -C "$repo" rev-parse HEAD)" = "$expected" || {
              echo "$repo did not check out expected SHA $expected" >&2; return 1;
            }
            default_branch="$(git -C "$repo" ls-remote --symref origin HEAD | sed -n 's#^ref: refs/heads/\([^[:space:]]*\)[[:space:]]*HEAD$#\1#p')"
            test -n "$default_branch" || {
              echo "Cannot resolve $repo default branch" >&2; return 1;
            }
            git -C "$repo" fetch --no-tags --unshallow origin \
              "+refs/heads/$default_branch:refs/remotes/origin/$default_branch"
            git -C "$repo" merge-base --is-ancestor \
              "$expected" "refs/remotes/origin/$default_branch" || {
                echo "$repo SHA $expected is not on protected branch $default_branch" >&2
                return 1
              }
          }
          verify_ancestor _axiom/axiom-encode "$AXIOM_ENCODE_SHA"
          verify_ancestor _axiom/axiom-rules-engine "$AXIOM_RULES_ENGINE_SHA"

      - name: Install Rust toolchain
        if: ${{ steps.policy.outputs.eligible == 'true' }}
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30

      - name: Set up Go 1.26.1
        if: ${{ steps.policy.outputs.eligible == 'true' }}
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.1
          cache: false

      - name: Stage protected axiom-encode install
        if: ${{ steps.policy.outputs.eligible == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          rm -rf "$RUNNER_TEMP/axiom-verification-site-packages"
          python -m pip install \
            --target "$RUNNER_TEMP/axiom-verification-site-packages" \
            ./_axiom/axiom-encode

      - name: Build protected supervisor
        if: ${{ steps.policy.outputs.eligible == 'true' }}
        working-directory: _axiom/axiom-encode
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags='-buildid=' \
            -o "$RUNNER_TEMP/axiom-encode-signing-supervisor" \
            ./cmd/axiom-encode-signing-supervisor

      - name: Build axiom-rules-engine
        if: ${{ steps.policy.outputs.eligible == 'true' }}
        working-directory: _axiom/axiom-rules-engine
        run: cargo build --verbose

      - name: Provision and record protected verification tree
        id: provision_tree
        if: ${{ steps.policy.outputs.eligible == 'true' }}
        working-directory: _axiom/axiom-encode
        shell: bash
        env:
          TRUST_APPLY_ROOT: ${{ vars.AXIOM_ENCODE_APPLY_SIGNING_PUBLIC_KEY }}
          TRUST_EVAL_ROOT: ${{ vars.AXIOM_ENCODE_EVAL_SIGNING_PUBLIC_KEY }}
          TRUST_CORPUS_RELEASE_ROOT: ${{ vars.AXIOM_CORPUS_RELEASE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          sudo rm -rf /opt/axiom-verification
          # Resolve setup-python before sudo: secure_path would otherwise make
          # the provisioner copy the system interpreter's /usr prefix.
          sudo "$(command -v python)" scripts/provision_verification_supervisor.py \
            --destination /opt/axiom-verification \
            --supervisor "$RUNNER_TEMP/axiom-encode-signing-supervisor" \
            --site-packages "$RUNNER_TEMP/axiom-verification-site-packages" \
            --apply-root "$TRUST_APPLY_ROOT" --eval-root "$TRUST_EVAL_ROOT" \
            --corpus-release-root "$TRUST_CORPUS_RELEASE_ROOT"
          sudo install -m 0755 "$(command -v git)" \
            /opt/axiom-verification/python/bin/git
          sudo install -m 0755 \
            "$GITHUB_WORKSPACE/_axiom/axiom-rules-engine/target/debug/axiom-rules-engine" \
            /opt/axiom-verification/axiom-rules-engine
          sudo chown -R root:root /opt/axiom-verification
          sudo chmod -R u+rwX,go+rX,go-w /opt/axiom-verification
          sudo chown root:root /opt
          sudo chmod go-w /opt

          sudo "$(command -v python)" -I - <<'PY'
          import hashlib
          import json
          import os
          import stat
          from pathlib import Path

          root = Path("/opt/axiom-verification")
          manifest = root / ".axiom-verification-manifest.json"

          def digest(path: Path) -> str:
              value = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      value.update(chunk)
              return value.hexdigest()

          root_stat = root.lstat()
          if not stat.S_ISDIR(root_stat.st_mode) or root.is_symlink():
              raise SystemExit("protected verification root is not a real directory")
          entries = [
              {
                  "mode": stat.S_IMODE(root_stat.st_mode),
                  "path": ".",
                  "type": "directory",
              }
          ]
          for directory, directory_names, file_names in os.walk(root, followlinks=False):
              base = Path(directory)
              for name in sorted(directory_names + file_names):
                  path = base / name
                  if path == manifest:
                      continue
                  relative = path.relative_to(root).as_posix()
                  metadata = path.lstat()
                  mode = stat.S_IMODE(metadata.st_mode)
                  if stat.S_ISDIR(metadata.st_mode):
                      entries.append({"mode": mode, "path": relative, "type": "directory"})
                  elif stat.S_ISREG(metadata.st_mode):
                      entries.append(
                          {
                              "mode": mode,
                              "path": relative,
                              "sha256": digest(path),
                              "size": metadata.st_size,
                              "type": "file",
                          }
                      )
                  else:
                      raise SystemExit(f"protected tree contains a special path: {relative}")
          entries.sort(key=lambda item: (item["path"], item["type"]))
          payload = {"entries": entries, "schema": "axiom-verification-tree/v1"}
          encoded = (
              json.dumps(payload, sort_keys=True, separators=(",", ":")) + "\n"
          ).encode()
          manifest.write_bytes(encoded)
          manifest.chmod(0o644)
          PY
          sudo chown root:root \
            /opt/axiom-verification/.axiom-verification-manifest.json
          manifest_sha256="$(sudo sha256sum \
            /opt/axiom-verification/.axiom-verification-manifest.json | cut -d ' ' -f 1)"
          echo "manifest-sha256=$manifest_sha256" >> "$GITHUB_OUTPUT"

      - name: Exercise protected supervisor before caching
        if: ${{ steps.policy.outputs.eligible == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          /opt/axiom-verification/axiom-encode-signing-supervisor \
            --trusted-signing-roots /opt/axiom-verification/signing-trust-roots.json \
            --trusted-python-runtime-root /opt/axiom-verification/python \
            --trusted-python-import-root /opt/axiom-verification/python/lib/python${{ inputs.python-version }}/site-packages \
            --trusted-python-package-root /opt/axiom-verification/python/lib/python${{ inputs.python-version }}/site-packages/axiom_encode \
            -- /opt/axiom-verification/axiom-encode --help >/dev/null
          /opt/axiom-verification/axiom-rules-engine --help >/dev/null

      - name: Compute same-run protected-tree cache key
        if: ${{ steps.policy.outputs.eligible == 'true' }}
        id: cache_key
        shell: bash
        env:
          AXIOM_ENCODE_SHA: ${{ inputs.axiom-encode-ref }}
          AXIOM_RULES_ENGINE_SHA: ${{ inputs.axiom-rules-engine-ref }}
          MANIFEST_SHA256: ${{ steps.provision_tree.outputs.manifest-sha256 }}
          RESOLVED_PYTHON_VERSION: ${{ steps.python.outputs.python-version }}
          # Round-trip through JSON for actionlint releases whose static job
          # schema predates GitHub's reusable-workflow identity properties.
          WORKFLOW_HASH: ${{ fromJSON(toJSON(job)).workflow_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$RESOLVED_PYTHON_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.+-][A-Za-z0-9.-]+)?$ ]]; then
            echo "setup-python returned an unsafe version: $RESOLVED_PYTHON_VERSION" >&2
            exit 1
          fi
          if [[ ! "$WORKFLOW_HASH" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Reusable workflow identity is not an exact commit hash: $WORKFLOW_HASH" >&2
            exit 1
          fi
          if [[ ! "$MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Fresh provision did not emit a valid manifest digest" >&2
            exit 1
          fi
          if [[ ! "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]] \
            || [[ ! "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]; then
            echo "GitHub run identity is not numeric" >&2
            exit 1
          fi
          nonce="$(openssl rand -hex 16)"
          if [[ ! "$nonce" =~ ^[0-9a-f]{32}$ ]]; then
            echo "Could not create a safe cache-generation nonce" >&2
            exit 1
          fi
          # job.workflow_sha identifies this reusable workflow rather than the
          # caller checkout. The random generation and manifest suffix make
          # this an exact same-run handoff, not an unsigned cross-run authority.
          key="axiom-verification-${RUNNER_OS}-${RUNNER_ARCH}-${AXIOM_ENCODE_SHA}-${AXIOM_RULES_ENGINE_SHA}-${RESOLVED_PYTHON_VERSION}-${WORKFLOW_HASH}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${nonce}-${MANIFEST_SHA256}"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      # The cache never grants signing or execution authority: this job freshly
      # builds from authenticated dependency commits, and its out-of-cache job
      # output is the digest authority for every matrix leg. The unpredictable
      # same-run key prevents a competing job from pre-populating the entry.
      - name: Save protected verification tree cache
        id: save_cache
        if: ${{ steps.policy.outputs.eligible == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: /opt/axiom-verification
          key: ${{ steps.cache_key.outputs.key }}

      - name: Publish protected cache result
        id: result
        if: ${{ always() }}
        shell: bash
        env:
          FRESH_MANIFEST_SHA256: ${{ steps.provision_tree.outputs.manifest-sha256 }}
          PRIMARY_CACHE_KEY: ${{ steps.cache_key.outputs.key }}
          PYTHON_VERSION: ${{ steps.python.outputs.python-version }}
          SAVE_OUTCOME: ${{ steps.save_cache.outcome }}
        run: |
          set -euo pipefail
          cache_ready=false
          cache_key=""
          manifest_sha256=""
          python_version=""
          if [[ "$PRIMARY_CACHE_KEY" =~ ^axiom-verification-[A-Za-z0-9._-]+$ ]] \
            && [[ "$FRESH_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]] \
            && [ "$SAVE_OUTCOME" = "success" ]; then
            cache_ready=true
            cache_key="$PRIMARY_CACHE_KEY"
            manifest_sha256="$FRESH_MANIFEST_SHA256"
            python_version="$PYTHON_VERSION"
          else
            echo "Same-run cache unavailable; validation legs will provision fresh." >&2
          fi
          {
            echo "cache-ready=$cache_ready"
            echo "cache-key=$cache_key"
            echo "manifest-sha256=$manifest_sha256"
            echo "python-version=$python_version"
          } >> "$GITHUB_OUTPUT"

  validate:
    # Keep the check name exactly `validate` across matrix legs so existing
    # required-status configs keep matching. A root at or below the cap keeps
    # its single leg; only oversized roots gain deterministic sub-shards.
    name: validate
    needs: [shards, provision]
    # A failed optional cache fanout must not suppress validation. Only shard
    # discovery is gating; empty provision outputs select the original path.
    if: ${{ always() && needs.shards.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.shards.outputs.matrix) }}

    steps:
      # This job stacks four dependency checkouts, Go + Rust toolchains, an
      # isolated verification runtime, and an engine build on one ~14 GB
      # runner disk; reclaim the preinstalled bloat first or the runner dies
      # mid-job with "No space left on device" (and no usable step logs).
      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk before cleanup:" && df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          echo "Disk after cleanup:" && df -h /

      - name: Set up Python
        id: python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Prepare protected-tree cache restore
        id: prepare_cache
        if: ${{ needs.provision.outputs.cache-ready == 'true' }}
        shell: bash
        env:
          EXPECTED_CACHE_KEY: ${{ needs.provision.outputs.cache-key }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.provision.outputs.manifest-sha256 }}
          EXPECTED_PYTHON_VERSION: ${{ needs.provision.outputs.python-version }}
          RESOLVED_PYTHON_VERSION: ${{ steps.python.outputs.python-version }}
          TRUST_APPLY_ROOT: ${{ vars.AXIOM_ENCODE_APPLY_SIGNING_PUBLIC_KEY }}
          TRUST_EVAL_ROOT: ${{ vars.AXIOM_ENCODE_EVAL_SIGNING_PUBLIC_KEY }}
          TRUST_CORPUS_RELEASE_ROOT: ${{ vars.AXIOM_CORPUS_RELEASE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          cache_ready=true
          if [[ ! "$EXPECTED_CACHE_KEY" =~ ^axiom-verification-[A-Za-z0-9._-]+$ ]]; then
            echo "Provision job did not emit a safe cache key" >&2
            cache_ready=false
          fi
          if [[ ! "$EXPECTED_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Provision job did not emit a valid manifest digest" >&2
            cache_ready=false
          fi
          case "$EXPECTED_CACHE_KEY" in
            *-"$EXPECTED_MANIFEST_SHA256") : ;;
            *)
              echo "Cache key is not bound to the expected manifest digest" >&2
              cache_ready=false
              ;;
          esac
          if [ "$RESOLVED_PYTHON_VERSION" != "$EXPECTED_PYTHON_VERSION" ]; then
            echo "setup-python resolved inconsistently across jobs: $RESOLVED_PYTHON_VERSION != $EXPECTED_PYTHON_VERSION" >&2
            cache_ready=false
          fi
          if [ -z "$TRUST_APPLY_ROOT" ] || [ -z "$TRUST_EVAL_ROOT" ] \
            || [ -z "$TRUST_CORPUS_RELEASE_ROOT" ]; then
            echo "Current signing trust roots are unavailable" >&2
            cache_ready=false
          fi
          if [ "$cache_ready" = "true" ]; then
            if sudo rm -rf /opt/axiom-verification \
              && sudo install -d -o "$(id -u)" -g "$(id -g)" -m 0755 \
                /opt/axiom-verification; then
              :
            else
              echo "Could not prepare cache destination; provisioning fresh." >&2
              cache_ready=false
            fi
          fi
          echo "ready=$cache_ready" >> "$GITHUB_OUTPUT"

      - name: Restore protected verification tree cache
        id: verification_cache
        if: ${{ steps.prepare_cache.outputs.ready == 'true' }}
        continue-on-error: true
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: /opt/axiom-verification
          key: ${{ needs.provision.outputs.cache-key }}

      - name: Verify restored protected tree before use
        id: verify_cache
        if: ${{ steps.prepare_cache.outputs.ready == 'true' }}
        shell: bash
        env:
          CACHE_HIT: ${{ steps.verification_cache.outputs.cache-hit }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.provision.outputs.manifest-sha256 }}
          TRUST_APPLY_ROOT: ${{ vars.AXIOM_ENCODE_APPLY_SIGNING_PUBLIC_KEY }}
          TRUST_EVAL_ROOT: ${{ vars.AXIOM_ENCODE_EVAL_SIGNING_PUBLIC_KEY }}
          TRUST_CORPUS_RELEASE_ROOT: ${{ vars.AXIOM_CORPUS_RELEASE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          cache_valid=false
          if [ "$CACHE_HIT" = "true" ] && python -I - <<'PY'
          import hashlib
          import hmac
          import json
          import os
          import stat
          from pathlib import Path

          root = Path("/opt/axiom-verification")
          manifest = root / ".axiom-verification-manifest.json"

          def fail(message: str) -> None:
              raise SystemExit(f"Protected cache rejected: {message}")

          def digest(path: Path) -> str:
              value = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      value.update(chunk)
              return value.hexdigest()

          root_stat = root.lstat()
          if not stat.S_ISDIR(root_stat.st_mode) or root.is_symlink():
              fail("root is not a real directory")
          if manifest.is_symlink() or not manifest.is_file():
              fail("recorded manifest is not a regular file")
          manifest_stat = manifest.stat()
          if stat.S_IMODE(manifest_stat.st_mode) != 0o644:
              fail("recorded manifest mode is not 0644")
          if manifest_stat.st_size > 32 * 1024 * 1024:
              fail("recorded manifest is unreasonably large")

          entries = [
              {
                  "mode": stat.S_IMODE(root_stat.st_mode),
                  "path": ".",
                  "type": "directory",
              }
          ]
          for directory, directory_names, file_names in os.walk(root, followlinks=False):
              base = Path(directory)
              for name in sorted(directory_names + file_names):
                  path = base / name
                  if path == manifest:
                      continue
                  relative = path.relative_to(root).as_posix()
                  metadata = path.lstat()
                  mode = stat.S_IMODE(metadata.st_mode)
                  if stat.S_ISDIR(metadata.st_mode):
                      entries.append({"mode": mode, "path": relative, "type": "directory"})
                  elif stat.S_ISREG(metadata.st_mode):
                      entries.append(
                          {
                              "mode": mode,
                              "path": relative,
                              "sha256": digest(path),
                              "size": metadata.st_size,
                              "type": "file",
                          }
                      )
                  else:
                      fail(f"special or symbolic path found: {relative}")
          entries.sort(key=lambda item: (item["path"], item["type"]))
          actual_manifest = (
              json.dumps(
                  {"entries": entries, "schema": "axiom-verification-tree/v1"},
                  sort_keys=True,
                  separators=(",", ":"),
              )
              + "\n"
          ).encode()
          recorded_manifest = manifest.read_bytes()
          if not hmac.compare_digest(recorded_manifest, actual_manifest):
              fail("recorded manifest does not match the complete restored tree")
          actual_manifest_sha256 = hashlib.sha256(recorded_manifest).hexdigest()
          expected_manifest_sha256 = os.environ["EXPECTED_MANIFEST_SHA256"]
          if not hmac.compare_digest(actual_manifest_sha256, expected_manifest_sha256):
              fail("manifest digest does not match the cache authority job")

          expected_trust_roots = (
              json.dumps(
                  {
                      "apply_ed25519_public_key": os.environ["TRUST_APPLY_ROOT"],
                      "corpus_release_ed25519_public_key": os.environ[
                          "TRUST_CORPUS_RELEASE_ROOT"
                      ],
                      "eval_ed25519_public_key": os.environ["TRUST_EVAL_ROOT"],
                      "schema": "axiom-encode/signing-trust-roots/v2",
                  },
                  sort_keys=True,
              )
              + "\n"
          ).encode()
          trust_roots = root / "signing-trust-roots.json"
          if trust_roots.is_symlink() or not trust_roots.is_file():
              fail("signing trust roots are not a regular file")
          if not hmac.compare_digest(trust_roots.read_bytes(), expected_trust_roots):
              fail("cached signing trust roots differ from current organization roots")
          print(
              "Restored tree matches the cache authority's manifest and "
              "current signing trust roots."
          )
          PY
          then
            cache_valid=true
          else
            echo "Cache unavailable or untrusted; falling back to fresh provisioning."
            sudo rm -rf /opt/axiom-verification || true
          fi

          if [ "$cache_valid" = "true" ]; then
            # This is deliberately before the caller checkout: no repository
            # module can shadow the isolated verifier or race the hardening.
            if sudo chown -R root:root /opt/axiom-verification \
              && sudo chmod -R u+rwX,go+rX,go-w /opt/axiom-verification \
              && sudo chown root:root /opt \
              && sudo chmod go-w /opt; then
              # Exercise both cached executables only after the complete tree
              # is bound to the fresh job-output digest and made non-writable.
              # The supervisor re-checks the trusted roots on this and every
              # later invocation. ABI/runtime mismatch means cache miss.
              if /opt/axiom-verification/axiom-encode-signing-supervisor \
                --trusted-signing-roots /opt/axiom-verification/signing-trust-roots.json \
                --trusted-python-runtime-root /opt/axiom-verification/python \
                --trusted-python-import-root /opt/axiom-verification/python/lib/python${{ inputs.python-version }}/site-packages \
                --trusted-python-package-root /opt/axiom-verification/python/lib/python${{ inputs.python-version }}/site-packages/axiom_encode \
                -- /opt/axiom-verification/axiom-encode --help >/dev/null \
                && /opt/axiom-verification/axiom-rules-engine --help >/dev/null; then
                echo "Restored protected tree passed executable smoke tests."
              else
                cache_valid=false
                echo "Cached executable smoke test failed; provisioning fresh."
                sudo rm -rf /opt/axiom-verification || true
              fi
            else
              cache_valid=false
              echo "Could not harden cached tree; provisioning fresh."
              sudo rm -rf /opt/axiom-verification || true
            fi
          fi
          echo "valid=$cache_valid" >> "$GITHUB_OUTPUT"

      - name: Checkout rules repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Resolve shard validation roots
        id: resolve_roots
        shell: bash
        env:
          SHARD_DESCRIPTORS: ${{ needs.shards.outputs.descriptors }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import json
          import os
          from pathlib import Path

          shard = os.environ["SHARD"]
          descriptors = json.loads(os.environ["SHARD_DESCRIPTORS"])
          matches = [item for item in descriptors if item.get("id") == shard]
          if len(matches) != 1:
              raise SystemExit(f"matrix shard {shard!r} has {len(matches)} descriptors")
          descriptor = matches[0]
          filters = json.dumps(descriptor["filters"], separators=(",", ":"))
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              print(f"roots={descriptor['root']}", file=output)
              print(f"filters={filters}", file=output)
          print(f"Shard validation root: {descriptor['root']}")
          print("Shard filters: " + ", ".join(descriptor["filters"]))
          PY

      - name: Resolve RuleSpec toolchain
        id: toolchain
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          python -I - <<'PY'
          import os
          import re
          import subprocess
          import sys
          import tomllib
          from pathlib import Path

          TOOLCHAIN_PATH = Path(".axiom/toolchain.toml")
          EXPECTED_KEYS = {
              "axiom_corpus_release",
              "axiom_corpus_release_content_sha256",
              "validation_waiver_set_sha256",
          }
          SHA256_RE = re.compile(r"[0-9a-f]{64}")
          RELEASE_RE = re.compile(r"[a-z0-9]+(?:-[a-z0-9]+)*")

          def fail(message: str) -> None:
              print(f"RuleSpec toolchain error: {message}", file=sys.stderr)
              sys.exit(1)

          def load_toolchain(raw: bytes) -> dict[str, str]:
              try:
                  payload = tomllib.loads(raw.decode("utf-8"))
              except (UnicodeError, tomllib.TOMLDecodeError) as exc:
                  fail(f"toolchain file is not valid UTF-8 TOML: {exc}")
              if set(payload) != {"toolchain"} or not isinstance(payload["toolchain"], dict):
                  fail("toolchain file must contain exactly one top-level [toolchain] table")
              table = payload["toolchain"]
              if set(table) != EXPECTED_KEYS:
                  fail("[toolchain] must contain exactly: " + ", ".join(sorted(EXPECTED_KEYS)))
              if not all(isinstance(value, str) for value in table.values()):
                  fail("all [toolchain] values must be strings")
              if RELEASE_RE.fullmatch(table["axiom_corpus_release"]) is None:
                  fail("axiom_corpus_release is not a canonical immutable release name")
              if table["axiom_corpus_release"] == "current":
                  fail("axiom_corpus_release must not use the mutable current alias")
              for key in EXPECTED_KEYS - {"axiom_corpus_release"}:
                  if SHA256_RE.fullmatch(table[key]) is None:
                      fail(f"{key} must be a lowercase sha256 digest")
              return table

          def base_toolchain() -> dict[str, object] | None:
              base_sha = os.environ.get("PR_BASE_SHA")
              if not base_sha:
                  return None
              result = subprocess.run(
                  ["git", "show", f"{base_sha}:.axiom/toolchain.toml"],
                  check=False,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.DEVNULL,
              )
              if result.returncode != 0:
                  return None
              # A base branch that predates the canonical-toolchain migration
              # carries an old-schema toolchain. For the removal-guard below,
              # that is equivalent to "no canonical toolchain yet": only a base
              # whose toolchain already conforms to the strict schema may be
              # forbidden from dropping it. Parse the base softly (key set only)
              # so the very PR that performs the migration is not rejected for
              # the base still being pre-migration. Any base already on the
              # protected branch necessarily passed strict validation to land,
              # so an exact EXPECTED_KEYS match is a sufficient "is migrated"
              # signal here.
              try:
                  payload = tomllib.loads(result.stdout.decode("utf-8"))
              except (UnicodeError, tomllib.TOMLDecodeError):
                  return None
              table = payload.get("toolchain")
              if not isinstance(table, dict) or set(table) != EXPECTED_KEYS:
                  return None
              return table

          base_config = base_toolchain()
          if not TOOLCHAIN_PATH.is_file() or TOOLCHAIN_PATH.is_symlink():
              if base_config is not None:
                  fail(".axiom/toolchain.toml cannot be removed once a base branch uses it")
              fail("a regular .axiom/toolchain.toml is required")
          config = load_toolchain(TOOLCHAIN_PATH.read_bytes())

          waiver_path = Path("known-validation-gaps.yaml")
          if not waiver_path.is_file() or waiver_path.is_symlink():
              fail("known-validation-gaps.yaml must be a regular file")
          import hashlib
          waiver_sha256 = hashlib.sha256(waiver_path.read_bytes()).hexdigest()
          if waiver_sha256 != config["validation_waiver_set_sha256"]:
              fail(
                  "ValidationWaiverHashMismatch: known-validation-gaps.yaml "
                  f"sha256 {waiver_sha256} != pinned "
                  f"{config['validation_waiver_set_sha256']}"
              )

          output_path = Path(os.environ["GITHUB_OUTPUT"])
          with output_path.open("a") as output:
              for key, value in config.items():
                  print(f"{key}={value}", file=output)
          print(f"Resolved strict RuleSpec toolchain from {TOOLCHAIN_PATH}:")
          for key, value in config.items():
              print(f"- {key}: {value}")
          PY

      - name: Validate immutable dependency inputs
        shell: bash
        env:
          AXIOM_ENCODE_SHA: ${{ inputs.axiom-encode-ref }}
          AXIOM_RULES_ENGINE_SHA: ${{ inputs.axiom-rules-engine-ref }}
          AXIOM_CORPUS_SHA: ${{ inputs.axiom-corpus-ref }}
          RULESPEC_US_SHA: ${{ inputs.rulespec-us-ref }}
          RELEASE_BASE_URL: ${{ inputs.corpus-release-base-url }}
          RELEASE_REGISTRY_URL: ${{ inputs.corpus-release-registry-url }}
          RELEASE_REGISTRY_ANON_KEY: ${{ inputs.corpus-release-registry-anon-key }}
          PYTHON_VERSION: ${{ inputs.python-version }}
        run: |
          set -euo pipefail
          for value in "$AXIOM_ENCODE_SHA" "$AXIOM_RULES_ENGINE_SHA" "$AXIOM_CORPUS_SHA" "$RULESPEC_US_SHA"; do
            if [[ ! "$value" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Dependency inputs must be exact 40-character lowercase commit SHAs: $value" >&2
              exit 1
            fi
          done
          # python-version is spliced into many run: blocks; bound it to major.minor
          # so a caller cannot smuggle shell into those steps (fail-open / RCE).
          if [[ ! "$PYTHON_VERSION" =~ ^3\.[0-9]+$ ]]; then
            echo "python-version must be a bare major.minor like 3.14: $PYTHON_VERSION" >&2
            exit 1
          fi
          if [ -n "$RELEASE_REGISTRY_URL" ]; then
            case "$RELEASE_REGISTRY_URL" in
              https://*) ;;
              *) echo "corpus-release-registry-url must use HTTPS" >&2; exit 1 ;;
            esac
            if [ -z "$RELEASE_REGISTRY_ANON_KEY" ]; then
              echo "corpus-release-registry-anon-key is required with corpus-release-registry-url" >&2
              exit 1
            fi
          else
            if [ -n "$RELEASE_REGISTRY_ANON_KEY" ]; then
              echo "corpus-release-registry-anon-key requires corpus-release-registry-url" >&2
              exit 1
            fi
            case "$RELEASE_BASE_URL" in
              https://*) ;;
              *) echo "corpus-release-base-url must use HTTPS" >&2; exit 1 ;;
            esac
          fi

      - name: Checkout axiom-encode
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: TheAxiomFoundation/axiom-encode
          ref: ${{ inputs.axiom-encode-ref }}
          path: _axiom/axiom-encode
          persist-credentials: false

      - name: Checkout axiom-rules-engine
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: TheAxiomFoundation/axiom-rules-engine
          ref: ${{ inputs.axiom-rules-engine-ref }}
          path: _axiom/axiom-rules-engine
          persist-credentials: false

      - name: Checkout axiom-corpus
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: TheAxiomFoundation/axiom-corpus
          ref: ${{ inputs.axiom-corpus-ref }}
          path: _axiom/axiom-corpus
          persist-credentials: false

      - name: Checkout rulespec-us canonical targets
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: TheAxiomFoundation/rulespec-us
          ref: ${{ inputs.rulespec-us-ref }}
          path: _axiom/rulespec-us
          persist-credentials: false

      - name: Authenticate dependency commits
        shell: bash
        env:
          AXIOM_ENCODE_SHA: ${{ inputs.axiom-encode-ref }}
          AXIOM_RULES_ENGINE_SHA: ${{ inputs.axiom-rules-engine-ref }}
          AXIOM_CORPUS_SHA: ${{ inputs.axiom-corpus-ref }}
          RULESPEC_US_SHA: ${{ inputs.rulespec-us-ref }}
        run: |
          set -euo pipefail
          verify_ancestor() {
            local repo="$1" expected="$2"
            test "$(git -C "$repo" rev-parse HEAD)" = "$expected" || {
              echo "$repo did not check out expected SHA $expected" >&2; return 1;
            }
            default_branch="$(git -C "$repo" ls-remote --symref origin HEAD | sed -n 's#^ref: refs/heads/\([^[:space:]]*\)[[:space:]]*HEAD$#\1#p')"
            test -n "$default_branch" || { echo "Cannot resolve $repo default branch" >&2; return 1; }
            git -C "$repo" fetch --no-tags --unshallow origin "+refs/heads/$default_branch:refs/remotes/origin/$default_branch"
            git -C "$repo" merge-base --is-ancestor "$expected" "refs/remotes/origin/$default_branch" || {
              echo "$repo SHA $expected is not an ancestor of protected default branch $default_branch" >&2; return 1;
            }
          }
          verify_ancestor _axiom/axiom-encode "$AXIOM_ENCODE_SHA"
          verify_ancestor _axiom/axiom-rules-engine "$AXIOM_RULES_ENGINE_SHA"
          verify_ancestor _axiom/axiom-corpus "$AXIOM_CORPUS_SHA"
          verify_ancestor _axiom/rulespec-us "$RULESPEC_US_SHA"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30

      - name: Set up Go 1.26.1
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.1
          cache: false

      - name: Install Python dependencies
        shell: bash
        env:
          CACHE_VALID: ${{ steps.verify_cache.outputs.valid }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml
          python -m pip install -e _axiom/axiom-encode
          if [ "$CACHE_VALID" != "true" ]; then
            rm -rf "$RUNNER_TEMP/axiom-verification-site-packages"
            python -m pip install \
              --target "$RUNNER_TEMP/axiom-verification-site-packages" \
              ./_axiom/axiom-encode
          fi

      - name: Fetch pinned signed corpus release object
        shell: bash
        env:
          RELEASE_BASE_URL: ${{ inputs.corpus-release-base-url }}
          RELEASE_REGISTRY_URL: ${{ inputs.corpus-release-registry-url }}
          RELEASE_REGISTRY_ANON_KEY: ${{ inputs.corpus-release-registry-anon-key }}
          RELEASE_NAME: ${{ steps.toolchain.outputs.axiom_corpus_release }}
          RELEASE_CONTENT_SHA256: ${{ steps.toolchain.outputs.axiom_corpus_release_content_sha256 }}
        run: |
          set -euo pipefail
          destination="$GITHUB_WORKSPACE/_axiom/axiom-corpus/releases/$RELEASE_NAME/$RELEASE_CONTENT_SHA256.json"
          mkdir -p "$(dirname "$destination")"
          if [ -n "$RELEASE_REGISTRY_URL" ]; then
            acquisition=registry
            url="${RELEASE_REGISTRY_URL%/}/rest/v1/release_objects?select=release_object&release_name=eq.${RELEASE_NAME}&content_sha256=eq.${RELEASE_CONTENT_SHA256}&limit=2"
            curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
              --header "apikey: $RELEASE_REGISTRY_ANON_KEY" \
              --header "Authorization: Bearer $RELEASE_REGISTRY_ANON_KEY" \
              --header "Accept-Profile: corpus" \
              --output "$destination.tmp" "$url"
          else
            acquisition=object
            url="${RELEASE_BASE_URL%/}/releases/$RELEASE_NAME/$RELEASE_CONTENT_SHA256.json"
            curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
              --output "$destination.tmp" "$url"
          fi
          python - "$destination.tmp" "$RELEASE_NAME" "$RELEASE_CONTENT_SHA256" "$acquisition" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          path, expected_name, expected_sha, acquisition = (
              Path(sys.argv[1]), sys.argv[2], sys.argv[3], sys.argv[4]
          )
          try:
              response = json.loads(path.read_bytes())
          except (OSError, json.JSONDecodeError) as exc:
              raise SystemExit(f"Corpus release acquisition error: invalid JSON: {exc}")
          if acquisition == "registry":
              if (
                  not isinstance(response, list)
                  or len(response) != 1
                  or not isinstance(response[0], dict)
              ):
                  raise SystemExit(
                      "Corpus release acquisition error: registry did not return exactly one row"
                  )
              payload = response[0].get("release_object")
          else:
              payload = response
          if not isinstance(payload, dict):
              raise SystemExit("Corpus release acquisition error: missing release object")
          if payload.get("release") != expected_name:
              raise SystemExit("Corpus release acquisition error: release name mismatch")
          content = payload.get("content")
          if not isinstance(content, dict):
              raise SystemExit("Corpus release acquisition error: missing content object")
          actual = hashlib.sha256(json.dumps(
              content, sort_keys=True, separators=(",", ":"), ensure_ascii=True,
          ).encode()).hexdigest()
          if payload.get("content_sha256") != actual or actual != expected_sha:
              raise SystemExit(
                  f"Corpus release acquisition error: content sha256 mismatch "
                  f"({actual} != {expected_sha})"
              )
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          path.replace(path.with_suffix(""))
          PY

      - name: Authenticate signed corpus provenance commit
        shell: bash
        env:
          RELEASE_NAME: ${{ steps.toolchain.outputs.axiom_corpus_release }}
          RELEASE_CONTENT_SHA256: ${{ steps.toolchain.outputs.axiom_corpus_release_content_sha256 }}
          AXIOM_CORPUS_SHA: ${{ inputs.axiom-corpus-ref }}
        run: |
          set -euo pipefail
          object="_axiom/axiom-corpus/releases/$RELEASE_NAME/$RELEASE_CONTENT_SHA256.json"
          release_commit="$(python - "$object" <<'PY'
          import json
          import sys
          print(json.load(open(sys.argv[1]))["content"]["git"]["commit"])
          PY
          )"
          if [[ ! "$release_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Signed release provenance is not a full lowercase commit SHA" >&2
            exit 1
          fi
          default_branch="$(git -C _axiom/axiom-corpus ls-remote --symref origin HEAD | sed -n 's#^ref: refs/heads/\([^[:space:]]*\)[[:space:]]*HEAD$#\1#p')"
          git -C _axiom/axiom-corpus fetch --no-tags origin \
            "+refs/heads/$default_branch:refs/remotes/origin/$default_branch"
          git -C _axiom/axiom-corpus merge-base --is-ancestor \
            "$release_commit" "refs/remotes/origin/$default_branch" || {
              echo "Signed release provenance $release_commit is not on the corpus default branch" >&2
              exit 1
            }
          git -C _axiom/axiom-corpus merge-base --is-ancestor \
            "$release_commit" "$AXIOM_CORPUS_SHA" || {
              echo "Corpus checkout $AXIOM_CORPUS_SHA predates signed release provenance $release_commit" >&2
              exit 1
            }

      - name: Provision protected verification supervisor
        if: ${{ steps.verify_cache.outputs.valid != 'true' }}
        working-directory: _axiom/axiom-encode
        env:
          TRUST_APPLY_ROOT: ${{ vars.AXIOM_ENCODE_APPLY_SIGNING_PUBLIC_KEY }}
          TRUST_EVAL_ROOT: ${{ vars.AXIOM_ENCODE_EVAL_SIGNING_PUBLIC_KEY }}
          TRUST_CORPUS_RELEASE_ROOT: ${{ vars.AXIOM_CORPUS_RELEASE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          test -n "$TRUST_APPLY_ROOT" && test -n "$TRUST_EVAL_ROOT" && test -n "$TRUST_CORPUS_RELEASE_ROOT"
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags='-buildid=' \
            -o "$RUNNER_TEMP/axiom-encode-signing-supervisor" \
            ./cmd/axiom-encode-signing-supervisor
          sudo rm -rf /opt/axiom-verification
          # sudo resets PATH (secure_path), so a bare `python` under sudo is
          # the SYSTEM interpreter — and the provision script copies the
          # invoking interpreter's sys.base_prefix, i.e. it would copytree
          # /usr until the runner disk dies. Resolve the setup-python
          # interpreter in this shell and pass its absolute path through.
          sudo "$(command -v python)" scripts/provision_verification_supervisor.py \
            --destination /opt/axiom-verification \
            --supervisor "$RUNNER_TEMP/axiom-encode-signing-supervisor" \
            --site-packages "$RUNNER_TEMP/axiom-verification-site-packages" \
            --apply-root "$TRUST_APPLY_ROOT" --eval-root "$TRUST_EVAL_ROOT" \
            --corpus-release-root "$TRUST_CORPUS_RELEASE_ROOT"
          sudo chown -R 0:0 /opt/axiom-verification
          sudo chmod -R go-w /opt/axiom-verification
          # The supervisor refuses a trust chain with group/other-writable
          # ancestors, and /opt ships group-writable on hosted runners.
          # Harden the directory bit itself (contents are untouched; nothing
          # later in this job creates new /opt entries).
          # The supervised child's PATH is exactly the trusted tool directory
          # (the supervisor exports no ambient PATH), and the checkout-identity
          # probes shell out to git builtins (rev-parse --show-toplevel,
          # remote get-url origin) whenever a module sits inside a git
          # boundary — which every CI workspace does. Provision the runner's
          # git binary alongside the trusted tools so those probes fail closed
          # on identity, not on a missing binary.
          # With a provisioned python runtime the supervisor rewrites exec to
          # the trusted interpreter, so the child's PATH (= dirname of the
          # exec'd command) is the runtime's bin directory — install git
          # THERE, not at the verification root.
          sudo install -m 0755 "$(command -v git)" /opt/axiom-verification/python/bin/git
          sudo chown root:root /opt
          sudo chmod go-w /opt

      - name: Build axiom-rules-engine
        if: ${{ steps.verify_cache.outputs.valid != 'true' }}
        working-directory: _axiom/axiom-rules-engine
        run: cargo build --verbose

      - name: Materialize protected axiom-rules-engine
        shell: bash
        env:
          CACHE_VALID: ${{ steps.verify_cache.outputs.valid }}
        run: |
          set -euo pipefail
          checkout_binary="$GITHUB_WORKSPACE/_axiom/axiom-rules-engine/target/debug/axiom-rules-engine"
          protected_binary="/opt/axiom-verification/axiom-rules-engine"
          if [ "$CACHE_VALID" = "true" ]; then
            install -D -m 0755 "$protected_binary" "$checkout_binary"
          fi

      - name: Expose axiom-rules-engine on PATH
        run: echo "$GITHUB_WORKSPACE/_axiom/axiom-rules-engine/target/debug" >> "$GITHUB_PATH"

      - name: Link axiom-rules-engine as sibling checkout
        shell: bash
        run: |
          set -euo pipefail
          ln -sfn "$GITHUB_WORKSPACE/_axiom/axiom-rules-engine" "$GITHUB_WORKSPACE/../axiom-rules-engine"
          ln -sfn "$GITHUB_WORKSPACE/_axiom/axiom-corpus" "$GITHUB_WORKSPACE/../axiom-corpus"
          if [ "$(basename "$GITHUB_WORKSPACE")" != "rulespec-us" ]; then
            ln -sfn "$GITHUB_WORKSPACE/_axiom/rulespec-us" "$GITHUB_WORKSPACE/../rulespec-us"
          fi

      - name: Run repository tests
        if: ${{ inputs.run-pytest && matrix.shard == needs.shards.outputs.first }}
        run: |
          if [ -d tests ] && find tests -type f \( -name "test_*.py" -o -name "*_test.py" \) | grep -q .; then
            python -m pytest -q tests
          else
            echo "No Python tests found; skipping pytest."
          fi

      - name: Reject obsolete generated files
        if: ${{ matrix.shard == needs.shards.outputs.first }}
        run: |
          obsolete_ext="r""ac"
          matches="$(find . \
            \( -path ./.git -o -path ./_axiom -o -path ./.venv -o -path ./.pytest_cache \) -prune \
            -o \( -name "*.${obsolete_ext}" -o -name "*.${obsolete_ext}.test" \) -print)"
          if [ -n "$matches" ]; then
            printf '%s\n' "$matches" >&2
            exit 1
          fi

      - name: Reject disallowed repository layout
        if: ${{ matrix.shard == needs.shards.outputs.first }}
        shell: bash
        env:
          VALIDATE_ROOTS: ${{ needs.shards.outputs.roots }}
          ALLOWED_EXTRA_ROOTS: ${{ needs.shards.outputs.allowed-extra }}
        run: |
          set -euo pipefail

          if [ -f .axiom/repository-structure.yaml ]; then
          python - <<'PY'
          import fnmatch
          import sys
          from pathlib import Path, PurePosixPath

          import yaml

          CONFIG_PATH = Path(".axiom/repository-structure.yaml")

          def fail(message: str) -> None:
              print(f"Repository structure error: {message}", file=sys.stderr)
              sys.exit(1)

          def string_set(payload: object, key: str) -> set[str]:
              value = payload.get(key) if isinstance(payload, dict) else None
              if not isinstance(value, list) or not all(isinstance(item, str) for item in value):
                  fail(f"{key} must be a list of strings")
              normalized = {item.strip("/") for item in value}
              if "" in normalized:
                  fail(f"{key} contains an empty path")
              return normalized

          def tracked_files() -> list[str]:
              import subprocess

              result = subprocess.run(
                  ["git", "ls-files", "-z"],
                  check=True,
                  stdout=subprocess.PIPE,
              )
              return sorted(
                  path.decode()
                  for path in result.stdout.split(b"\0")
                  if path
              )

          config = yaml.safe_load(CONFIG_PATH.read_text()) or {}
          if not isinstance(config, dict):
              fail(f"{CONFIG_PATH} must contain a mapping")
          if config.get("version") != 1:
              fail(f"{CONFIG_PATH} must set version: 1")

          allowed_root_directories = string_set(config, "allowed_root_directories")
          allowed_root_files = string_set(config, "allowed_root_files")
          path_rules = config.get("path_rules")
          if not isinstance(path_rules, list) or not path_rules:
              fail("path_rules must be a non-empty list")

          normalized_rules: list[dict[str, object]] = []
          for index, rule in enumerate(path_rules, start=1):
              if not isinstance(rule, dict):
                  fail(f"path_rules[{index}] must be a mapping")
              patterns = rule.get("patterns")
              if not isinstance(patterns, list) or not patterns or not all(
                  isinstance(pattern, str) for pattern in patterns
              ):
                  fail(f"path_rules[{index}].patterns must be a non-empty list of strings")
              allow_extensions = rule.get("allow_extensions", [])
              allow_filenames = rule.get("allow_filenames", [])
              if not isinstance(allow_extensions, list) or not all(
                  isinstance(extension, str) for extension in allow_extensions
              ):
                  fail(f"path_rules[{index}].allow_extensions must be a list of strings")
              if not isinstance(allow_filenames, list) or not all(
                  isinstance(filename, str) for filename in allow_filenames
              ):
                  fail(f"path_rules[{index}].allow_filenames must be a list of strings")
              normalized_rules.append(
                  {
                      "patterns": [pattern.strip("/") for pattern in patterns],
                      "allow_extensions": set(allow_extensions),
                      "allow_filenames": set(allow_filenames),
                  }
              )

          problems: list[str] = []
          for path in tracked_files():
              parts = PurePosixPath(path).parts
              if len(parts) == 1:
                  if path not in allowed_root_files:
                      problems.append(f"{path}: top-level file is not allowed")
                  continue

              root = parts[0]
              if root not in allowed_root_directories:
                  problems.append(f"{path}: top-level directory {root}/ is not allowed")
                  continue

              matched_rule = None
              for rule in normalized_rules:
                  if any(fnmatch.fnmatchcase(path, pattern) for pattern in rule["patterns"]):
                      matched_rule = rule
                      break
              if matched_rule is None:
                  problems.append(f"{path}: no path rule matched")
                  continue

              name = PurePosixPath(path).name
              extension = PurePosixPath(path).suffix
              if name in matched_rule["allow_filenames"]:
                  continue
              if extension in matched_rule["allow_extensions"]:
                  continue
              problems.append(
                  f"{path}: file name/extension is not allowed by matched path rule"
              )

          if problems:
              print(
                  f"Repository layout does not match {CONFIG_PATH}.",
                  file=sys.stderr,
              )
              for problem in problems:
                  print(f"- {problem}", file=sys.stderr)
              sys.exit(1)

          print(f"Repository layout matches {CONFIG_PATH}.")
          PY
          exit 0
          fi
          disallowed=()

          for root in statute regulation policy; do
            if [ -e "$root" ]; then
              disallowed+=("$root/")
            fi
          done

          while IFS= read -r path; do
            disallowed+=("$path")
          done < <(
            find . \
              \( -path ./.git -o -path ./_axiom -o -path ./.venv -o -path ./.pytest_cache \) -prune \
              -o -type f \( -name "parameters.yaml" -o -name "tests.yaml" \) -print
          )

          while IFS= read -r path; do
            disallowed+=("$path")
          done < <(
            find tests -type f -name "*.yaml" 2>/dev/null || true
          )

          prune=( -path ./.git -o -path ./_axiom -o -path ./.venv -o -path ./.pytest_cache -o -path ./.github )
          for allowed in $VALIDATE_ROOTS $ALLOWED_EXTRA_ROOTS; do
            prune+=( -o -path "./$allowed" )
          done
          while IFS= read -r path; do
            disallowed+=("$path")
          done < <(
            find . \( "${prune[@]}" \) -prune \
              -o -type f \( -name "*.yaml" -o -name "*.yml" \) \
                ! -name "known-dangling.yaml" ! -name "known-validation-gaps.yaml" -print
          )

          if [ "${#disallowed[@]}" -ne 0 ]; then
            printf 'Repository layout is not allowed. Use RuleSpec YAML under statutes/, regulations/, or policies/.\n' >&2
            printf '%s\n' "${disallowed[@]}" >&2
            exit 1
          fi

      - name: Enforce validation waiver ratchet
        if: ${{ matrix.shard == needs.shards.outputs.first }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_ref="${{ github.event.pull_request.base.sha }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base_ref="${{ github.event.before }}"
          else
            base_ref="HEAD~1"
          fi
          protected_base="$RUNNER_TEMP/protected-known-validation-gaps.yaml"
          changed_paths="$RUNNER_TEMP/waiver-changed-paths.txt"
          git show "$base_ref:known-validation-gaps.yaml" > "$protected_base" || {
            echo "ValidationWaiverBaseMissing: protected base must contain known-validation-gaps.yaml" >&2
            exit 1
          }
          git diff --name-only --no-renames --diff-filter=ACMRTD \
            "$base_ref" "$GITHUB_SHA" > "$changed_paths"
          python - "$protected_base" known-validation-gaps.yaml <<'PY'
          import sys
          from pathlib import Path

          import yaml

          base_path, head_path = map(Path, sys.argv[1:])
          base = yaml.safe_load(base_path.read_bytes())
          head = yaml.safe_load(head_path.read_bytes())
          base_entries = base.get("validate_failures", {}) if isinstance(base, dict) else {}
          head_entries = head.get("validate_failures", {}) if isinstance(head, dict) else {}
          if not isinstance(base_entries, dict) or not isinstance(head_entries, dict):
              raise SystemExit(
                  "ValidationWaiverRatchetSchema: validate_failures must be a mapping"
              )
          growth = []
          for module, head_states in head_entries.items():
              base_states = base_entries.get(module)
              if not isinstance(head_states, dict) or not isinstance(base_states, dict):
                  growth.append(str(module))
                  continue
              for state, metadata in head_states.items():
                  if base_states.get(state) == metadata:
                      continue
                  if state == "active" and base_states.get("pending") == metadata:
                      # A protected-base pending approval being consumed
                      # (pending -> active) is the sanctioned transition; the
                      # supervised audit still enforces the full protocol
                      # (exact consumption, expiry, waiver-only approvals).
                      continue
                  growth.append(f"{module}:{state}")
          if growth:
              raise SystemExit(
                  "ValidationWaiverRatchetGrowth: waivers may only shrink; "
                  "new, changed, or broadened records: " + ", ".join(sorted(growth))
              )
          print(
              "Validation waiver ratchet is decrement-only: "
              f"{len(base_entries)} base module(s) -> {len(head_entries)} head module(s)."
          )
          PY
          /opt/axiom-verification/axiom-encode-signing-supervisor \
            --trusted-signing-roots /opt/axiom-verification/signing-trust-roots.json \
            --trusted-python-runtime-root /opt/axiom-verification/python \
            --trusted-python-import-root /opt/axiom-verification/python/lib/python${{ inputs.python-version }}/site-packages \
            --trusted-python-package-root /opt/axiom-verification/python/lib/python${{ inputs.python-version }}/site-packages/axiom_encode \
            -- /opt/axiom-verification/axiom-encode validation-waivers audit \
            --root "$GITHUB_WORKSPACE" \
            --corpus-path "$GITHUB_WORKSPACE/_axiom/axiom-corpus" \
            --protected-base "$protected_base" \
            --changed-paths "$changed_paths" \
            --axiom-rules-engine-path "$GITHUB_WORKSPACE/_axiom/axiom-rules-engine"

      - name: Reject manual RuleSpec changes
        if: ${{ inputs.run-generated-guard && matrix.shard == needs.shards.outputs.first }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_ref="${{ github.event.pull_request.base.sha }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base_ref="${{ github.event.before }}"
          else
            base_ref="HEAD~1"
          fi

          /opt/axiom-verification/axiom-encode-signing-supervisor \
            --trusted-signing-roots /opt/axiom-verification/signing-trust-roots.json \
            --trusted-python-runtime-root /opt/axiom-verification/python \
            --trusted-python-import-root /opt/axiom-verification/python/lib/python${{ inputs.python-version }}/site-packages \
            --trusted-python-package-root /opt/axiom-verification/python/lib/python${{ inputs.python-version }}/site-packages/axiom_encode \
            -- /opt/axiom-verification/axiom-encode guard-generated \
            --repo "$GITHUB_WORKSPACE" \
            --base-ref "$base_ref" \
            --head-ref "$GITHUB_SHA" \
            --corpus-path "$GITHUB_WORKSPACE/_axiom/axiom-corpus" \
            --expected-encoder-checkout "$GITHUB_WORKSPACE/_axiom/axiom-encode"

      - name: Select RuleSpec validation targets
        id: validation_targets
        shell: bash
        env:
          VALIDATE_ROOTS: ${{ steps.resolve_roots.outputs.roots }}
          SHARD_FILTERS_JSON: ${{ steps.resolve_roots.outputs.filters }}
        run: |
          set -euo pipefail

          rulespec_file_list="$RUNNER_TEMP/rulespec-files.txt"
          test_file_list="$RUNNER_TEMP/rulespec-test-files.txt"
          : > "$rulespec_file_list"
          : > "$test_file_list"

          shard_filter_file="$RUNNER_TEMP/shard-filters.txt"
          python3 -I - <<'PY' > "$shard_filter_file"
          import json
          import os

          filters = json.loads(os.environ["SHARD_FILTERS_JSON"])
          if (
              not isinstance(filters, list)
              or not filters
              or not all(isinstance(item, str) for item in filters)
          ):
              raise SystemExit("shard descriptor has no subtree filters")
          for item in filters:
              print(item)
          PY
          mapfile -t shard_filters < "$shard_filter_file"
          if [ "${#shard_filters[@]}" -eq 0 ]; then
            echo "Shard descriptor decoded to no subtree filters" >&2
            exit 1
          fi

          matches_shard_filter() {
            local module_path="$1"
            local root="$2"
            local relative filter
            case "$module_path" in
              "$root"/*) relative="${module_path#"$root"/}" ;;
              *) return 1 ;;
            esac
            for filter in "${shard_filters[@]}"; do
              if [ "$filter" = "." ] || [ "$relative" = "$filter" ]; then
                return 0
              fi
              case "$relative" in
                "$filter"/*) return 0 ;;
              esac
            done
            return 1
          }

          add_existing_file() {
            local path="$1"
            local list="$2"
            if [ -f "$path" ]; then
              printf '%s\n' "$path" >> "$list"
            fi
            return 0
          }

          add_rulespec_target() {
            local path="$1"
            local root="$2"
            local module_path
            case "$path" in
              # Composition specs (the programs root, canonically nested
              # under the jurisdiction dir) are axiom-compose inputs, not
              # atomic RuleSpec modules — the encoder rejects them from
              # atomic validation by design.
              */programs/*|programs/*) return 0 ;;
            esac
            case "$path" in
              *.test.yaml)
                module_path="${path%.test.yaml}.yaml"
                matches_shard_filter "$module_path" "$root" || return 0
                add_existing_file "$path" "$test_file_list"
                add_existing_file "$module_path" "$rulespec_file_list"
                ;;
              *.test.yml)
                module_path="${path%.test.yml}.yml"
                matches_shard_filter "$module_path" "$root" || return 0
                add_existing_file "$path" "$test_file_list"
                add_existing_file "$module_path" "$rulespec_file_list"
                ;;
              *.yaml)
                module_path="$path"
                matches_shard_filter "$module_path" "$root" || return 0
                add_existing_file "$path" "$rulespec_file_list"
                add_existing_file "${path%.yaml}.test.yaml" "$test_file_list"
                ;;
              *.yml)
                module_path="$path"
                matches_shard_filter "$module_path" "$root" || return 0
                add_existing_file "$path" "$rulespec_file_list"
                add_existing_file "${path%.yml}.test.yml" "$test_file_list"
                ;;
            esac
            return 0
          }

          add_all_rulespec_targets() {
            local root path
            for root in $VALIDATE_ROOTS; do
              if [ -d "$root" ]; then
                while IFS= read -r -d '' path; do
                  add_rulespec_target "$path" "$root"
                done < <(
                  find "$root" -type f \( -name "*.yaml" -o -name "*.yml" \) \
                    ! -path "*/programs/*" -print0
                )
              fi
            done
          }

          classify_toolchain_change() {
            python - "$base_ref" <<'PY'
          import subprocess
          import sys
          import tomllib
          from pathlib import Path

          base_ref = sys.argv[1]
          path = Path(".axiom/toolchain.toml")
          result = subprocess.run(
              ["git", "show", f"{base_ref}:.axiom/toolchain.toml"],
              check=False,
              stdout=subprocess.PIPE,
              stderr=subprocess.DEVNULL,
          )
          if result.returncode != 0 or not path.exists():
              print("full")
              raise SystemExit

          def load(text: bytes) -> dict[str, object]:
              payload = tomllib.loads(text.decode())
              table = payload.get("toolchain", payload)
              if not isinstance(table, dict):
                  return {}
              return table

          before = load(result.stdout)
          after = load(path.read_bytes())
          changed = {
              key for key in set(before) | set(after)
              if before.get(key) != after.get(key)
          }
          if changed and changed <= {
              "axiom_corpus_release",
              "axiom_corpus_release_content_sha256",
          }:
              print("corpus-only")
          else:
              print("full")
          PY
          }

          mode="full-push"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_ref="${{ github.event.pull_request.base.sha }}"
            mapfile -t all_changed_paths < <(
              git diff --name-only --no-renames --diff-filter=ACMRTD "$base_ref" "$GITHUB_SHA"
            )
            mode="changed"
            for path in "${all_changed_paths[@]}"; do
              case "$path" in
                .github/workflows/*.yml|.github/workflows/*.yaml)
                  mode="full-toolchain-bump"
                  break
                  ;;
                .axiom/toolchain.toml)
                  if [ "$(classify_toolchain_change)" = "corpus-only" ]; then
                    mode="changed-corpus-toolchain-bump"
                  else
                    mode="full-toolchain-bump"
                    break
                  fi
                  ;;
              esac
            done

            if [ "$mode" = "full-toolchain-bump" ]; then
              add_all_rulespec_targets
            else
              for path in "${all_changed_paths[@]}"; do
                for root in $VALIDATE_ROOTS; do
                  case "$path" in
                    "$root"/*)
                      add_rulespec_target "$path" "$root"
                      ;;
                  esac
                done
              done
            fi
          else
            add_all_rulespec_targets
          fi

          sort -u "$rulespec_file_list" -o "$rulespec_file_list"
          sort -u "$test_file_list" -o "$test_file_list"

          {
            echo "RULESPEC_FILE_LIST=$rulespec_file_list"
            echo "RULESPEC_TEST_FILE_LIST=$test_file_list"
            echo "RULESPEC_VALIDATION_MODE=$mode"
          } >> "$GITHUB_ENV"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

          echo "RuleSpec validation mode: $mode"
          echo "RuleSpec files selected:"
          sed 's/^/- /' "$rulespec_file_list" || true
          echo "RuleSpec companion tests selected:"
          sed 's/^/- /' "$test_file_list" || true

      - name: Validate RuleSpec YAML
        shell: bash
        env:
          VALIDATE_ROOTS: ${{ steps.resolve_roots.outputs.roots }}
          AXIOM_RULESPEC_REPO_ROOTS: ${{ github.workspace }}:${{ github.workspace }}/_axiom/rulespec-us
          AXIOM_CORPUS_ARTIFACT_ROOT: ${{ github.workspace }}/data/corpus
          AXIOM_CORPUS_REPO: ${{ github.workspace }}/_axiom/axiom-corpus
        run: |
          set -euo pipefail

          mapfile -t rulespec_files < "$RULESPEC_FILE_LIST"

          if [ "${#rulespec_files[@]}" -eq 0 ]; then
            echo "No RuleSpec YAML files selected for validation."
            exit 0
          fi

          # Ratcheted pre-existing validate failures: repos may list files in
          # known-validation-gaps.yaml under `validate_failures` (each needs
          # an issue link in that file). Listed files are skipped LOUDLY.
          # Only ACTIVE waivers skip: a pending-only record is approved on
          # the protected base but not yet consumed by this branch, so its
          # module still validates (and fails) here.
          skip_list="$RUNNER_TEMP/validate-skip.txt"
          : > "$skip_list"
          if [ -f known-validation-gaps.yaml ]; then
            python - <<'SKIP' > "$skip_list"
          import yaml
          payload = yaml.safe_load(open("known-validation-gaps.yaml")) or {}
          failures = payload.get("validate_failures") or {}
          if isinstance(failures, dict):
              for module, states in failures.items():
                  if isinstance(states, dict) and "active" in states:
                      print(module)
          SKIP
          fi

          selected=()
          for file in "${rulespec_files[@]}"; do
            if grep -qxF "$file" "$skip_list"; then
              echo "SKIPPED (known-validation-gaps validate_failures): $file"
              continue
            fi
            selected+=("$GITHUB_WORKSPACE/$file")
          done

          if [ "${#selected[@]}" -eq 0 ]; then
            echo "All selected RuleSpec YAML files are skipped."
            exit 0
          fi

          # One invocation for all files: validation reuses one process and
          # one registry load instead of paying both per file. Failed files
          # are listed in the command's own summary output.
          /opt/axiom-verification/axiom-encode-signing-supervisor \
            --trusted-signing-roots /opt/axiom-verification/signing-trust-roots.json \
            --trusted-python-runtime-root /opt/axiom-verification/python \
            --trusted-python-import-root /opt/axiom-verification/python/lib/python${{ inputs.python-version }}/site-packages \
            --trusted-python-package-root /opt/axiom-verification/python/lib/python${{ inputs.python-version }}/site-packages/axiom_encode \
            -- /opt/axiom-verification/axiom-encode validate "${selected[@]}" \
            --skip-reviewers \
            --corpus-path "$GITHUB_WORKSPACE/_axiom/axiom-corpus" \
            --axiom-rules-engine-path "$GITHUB_WORKSPACE/_axiom/axiom-rules-engine"

      - name: Execute RuleSpec companion tests
        shell: bash
        env:
          VALIDATE_ROOTS: ${{ steps.resolve_roots.outputs.roots }}
          AXIOM_RULESPEC_REPO_ROOTS: ${{ github.workspace }}:${{ github.workspace }}/_axiom/rulespec-us
        run: |
          set -euo pipefail

          mapfile -t test_files < "$RULESPEC_TEST_FILE_LIST"

          # A module ratcheted under validate_failures cannot be expected to
          # execute either; skip its companion test loudly (same
          # known-validation-gaps.yaml list the validate step consults).
          skip_list="$RUNNER_TEMP/validate-skip.txt"
          selected=()
          for test_file in "${test_files[@]}"; do
            case "$test_file" in
              *.test.yaml) module_file="${test_file%.test.yaml}.yaml" ;;
              *.test.yml) module_file="${test_file%.test.yml}.yml" ;;
              *) module_file="$test_file" ;;
            esac
            if [ -s "$skip_list" ] && grep -qxF "$module_file" "$skip_list"; then
              echo "SKIPPED companion (known-validation-gaps validate_failures): $test_file"
              continue
            fi
            selected+=("$test_file")
          done

          if [ "${#selected[@]}" -eq 0 ]; then
            echo "No RuleSpec companion tests selected; skipping."
            exit 0
          fi

          # The hard-cut encoder requires --root to be the exact jurisdiction
          # content root (rulespec-<country>/<jurisdiction>), not the checkout;
          # group the selected companion tests by their jurisdiction directory
          # and run one invocation per group.
          declare -A by_root=()
          for test_file in "${selected[@]}"; do
            jurisdiction="${test_file%%/*}"
            # Paths are resolved relative to --root, so strip the
            # jurisdiction prefix or they double up (<root>/dk/dk/...).
            by_root[$jurisdiction]+="${test_file#"$jurisdiction"/}"$'\n'
          done
          for jurisdiction in "${!by_root[@]}"; do
            mapfile -t group <<< "${by_root[$jurisdiction]%$'\n'}"
            axiom-encode test \
              --root "$GITHUB_WORKSPACE/$jurisdiction" \
              --axiom-rules-engine-path "$GITHUB_WORKSPACE/_axiom/axiom-rules-engine" \
              "${group[@]}"
          done

      - name: Validate RuleSpec proofs and claims
        shell: bash
        env:
          VALIDATE_ROOTS: ${{ steps.resolve_roots.outputs.roots }}
          AXIOM_CORPUS_ARTIFACT_ROOT: ${{ github.workspace }}/data/corpus
          AXIOM_CORPUS_REPO: ${{ github.workspace }}/_axiom/axiom-corpus
        run: |
          set -euo pipefail

          mapfile -t rulespec_files < "$RULESPEC_FILE_LIST"

          if [ "${#rulespec_files[@]}" -eq 0 ]; then
            echo "No RuleSpec YAML files selected for proof validation."
            exit 0
          fi

          # Honor the same ratcheted validate_failures waivers the validate
          # step honors: a module declared as a known validation failure is
          # skipped LOUDLY here too, so the waiver protocol is consistent
          # across the validation matrix (a waived module otherwise passes
          # validate via its waiver and then hard-fails proof validation on
          # the same declared gap). The waiver protections — fingerprint
          # audit, decrement-only ratchet, stale-waiver detection, expiry —
          # are enforced by their own steps regardless of this skip.
          # Only ACTIVE waivers skip: a pending-only record is approved on
          # the protected base but not yet consumed by this branch, so its
          # module still proof-validates (and fails) here.
          skip_list="$RUNNER_TEMP/proof-validate-skip.txt"
          : > "$skip_list"
          if [ -f known-validation-gaps.yaml ]; then
            python - <<'SKIP' > "$skip_list"
          import yaml
          payload = yaml.safe_load(open("known-validation-gaps.yaml")) or {}
          failures = payload.get("validate_failures") or {}
          if isinstance(failures, dict):
              for module, states in failures.items():
                  if isinstance(states, dict) and "active" in states:
                      print(module)
          SKIP
          fi

          prefixed=()
          for file in "${rulespec_files[@]}"; do
            if grep -qxF "$file" "$skip_list"; then
              echo "SKIPPED (known-validation-gaps validate_failures): $file"
              continue
            fi
            prefixed+=("$GITHUB_WORKSPACE/$file")
          done

          if [ "${#prefixed[@]}" -eq 0 ]; then
            echo "All selected RuleSpec YAML files are skipped."
            exit 0
          fi

          # One invocation for all files; failed files are listed in the
          # command's own summary output.
          /opt/axiom-verification/axiom-encode-signing-supervisor \
            --trusted-signing-roots /opt/axiom-verification/signing-trust-roots.json \
            --trusted-python-runtime-root /opt/axiom-verification/python \
            --trusted-python-import-root /opt/axiom-verification/python/lib/python${{ inputs.python-version }}/site-packages \
            --trusted-python-package-root /opt/axiom-verification/python/lib/python${{ inputs.python-version }}/site-packages/axiom_encode \
            -- /opt/axiom-verification/axiom-encode proof-validate "${prefixed[@]}" \
            --corpus-path "$GITHUB_WORKSPACE/_axiom/axiom-corpus"

      - name: Require money proof atoms
        # Scan the whole repository (not just changed files) on the first
        # shard: the ratchet allowance is repo-wide, so a per-PR changed-file
        # subset could not tell whether a change raised the money-atom debt.
        # This is a cheap pure-Python pass (no compile, no engine build).
        if: ${{ inputs.run-money-atom-check && matrix.shard == needs.shards.outputs.first }}
        shell: bash
        env:
          VALIDATE_ROOTS: ${{ needs.shards.outputs.roots }}
        run: |
          set -euo pipefail

          money_atom_files=()
          for root in $VALIDATE_ROOTS; do
            if [ -d "$root" ]; then
              while IFS= read -r path; do
                money_atom_files+=("$path")
              done < <(
                find "$root" -type f \( -name "*.yaml" -o -name "*.yml" \) \
                  ! -name "*.test.yaml" ! -name "*.test.yml" \
                  ! -path "*/programs/*"
              )
            fi
          done

          if [ "${#money_atom_files[@]}" -eq 0 ]; then
            echo "No RuleSpec YAML files found for money-atom check."
            exit 0
          fi

          ratchet_args=()
          if [ -f known-missing-money-atoms.yaml ]; then
            echo "Using money-atom ratchet: known-missing-money-atoms.yaml"
            ratchet_args=(--ratchet-file known-missing-money-atoms.yaml)
          else
            echo "No known-missing-money-atoms.yaml ratchet; requiring zero missing money atoms."
          fi

          # --money-atoms-only checks solely the money obligations; it does
          # not re-run base proof-tree validation, so scanning the whole repo
          # here never re-reports unrelated proof issues on unchanged files
          # (those stay scoped to the changed-file proof step above).
          /opt/axiom-verification/axiom-encode-signing-supervisor \
            --trusted-signing-roots /opt/axiom-verification/signing-trust-roots.json \
            --trusted-python-runtime-root /opt/axiom-verification/python \
            --trusted-python-import-root /opt/axiom-verification/python/lib/python${{ inputs.python-version }}/site-packages \
            --trusted-python-package-root /opt/axiom-verification/python/lib/python${{ inputs.python-version }}/site-packages/axiom_encode \
            -- /opt/axiom-verification/axiom-encode proof-validate \
            "${money_atom_files[@]}" \
            --money-atoms-only \
            --corpus-path "$GITHUB_WORKSPACE/_axiom/axiom-corpus" \
            "${ratchet_args[@]}"

      - name: Validate PolicyEngine oracle coverage classification
        # This classifier scans the repository root, so one primary shard
        # preserves the gate without repeating the identical repo-wide work.
        if: ${{ matrix.shard == needs.shards.outputs.first && (github.event_name != 'pull_request' || steps.validation_targets.outputs.mode == 'full-toolchain-bump') }}
        shell: bash
        run: |
          set -euo pipefail
          axiom-encode oracle-coverage \
            --root "$GITHUB_WORKSPACE" \
            --fail-on-unmapped \
            --fail-on-untested-comparable \
            --limit 50

      - name: Checkout changed-file oracle coverage classifier
        if: ${{ github.event_name == 'pull_request' && steps.validation_targets.outputs.mode != 'full-toolchain-bump' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: TheAxiomFoundation/axiom-encode
          ref: ${{ inputs.axiom-encode-ref }}
          path: _axiom/axiom-encode-oracle-coverage
          persist-credentials: false

      - name: Install changed-file oracle coverage classifier
        if: ${{ github.event_name == 'pull_request' && steps.validation_targets.outputs.mode != 'full-toolchain-bump' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e _axiom/axiom-encode-oracle-coverage
          # The changed-file classifier checkout may pin an axiom-oracles commit
          # step installed. axiom-oracles is a git dependency whose version string
          # does not change per commit, so pip treats the pinned SHA as "already
          # satisfied" and keeps the stale copy — the classifier then reports
          # freshly-added not_comparable mappings as unmapped. Force-reinstall the
          # axiom-oracles pin declared by this checkout so the classifier reads its
          # bridge mappings, not the toolchain-pinned ones.
          oracles_spec="$(
            python - <<'PY'
          import pathlib
          import re

          text = pathlib.Path("_axiom/axiom-encode-oracle-coverage/pyproject.toml").read_text()
          match = re.search(
              r'"(axiom-oracles @ git\+https://github\.com/[^"]+)"', text
          )
          print(match.group(1) if match else "")
          PY
          )"
          if [ -n "$oracles_spec" ]; then
            python -m pip install --force-reinstall --no-deps "$oracles_spec"
          fi
          python - <<'PY'
          import importlib.metadata

          print(
              "Changed-file oracle coverage classifier uses axiom-encode "
              f"{importlib.metadata.version('axiom-encode')}."
          )
          PY

      - name: Validate changed PolicyEngine oracle coverage classification
        if: ${{ github.event_name == 'pull_request' && steps.validation_targets.outputs.mode != 'full-toolchain-bump' }}
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s "$RULESPEC_FILE_LIST" ]; then
            echo "No changed RuleSpec YAML files selected for oracle coverage."
            exit 0
          fi

          coverage_json="$RUNNER_TEMP/policyengine-oracle-coverage.json"
          axiom-encode oracle-coverage \
            --root "$GITHUB_WORKSPACE" \
            --json > "$coverage_json"

          python - "$coverage_json" "$RULESPEC_FILE_LIST" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          coverage_path = Path(sys.argv[1])
          rulespec_file_list = Path(sys.argv[2])
          repo = Path(os.environ["GITHUB_WORKSPACE"]).name
          if repo.startswith("rulespec-be"):
              print(
                  "Changed PolicyEngine oracle coverage skipped for Belgium; "
                  "rulespec-be uses the EUROMOD household-level oracle surface."
              )
              raise SystemExit
          changed = {
              f"{repo}/{line.strip()}"
              for line in rulespec_file_list.read_text().splitlines()
              if line.strip()
          }
          payload = json.loads(coverage_path.read_text())
          items = [
              item for item in payload.get("items", [])
              if item.get("file") in changed
          ]
          failures = []
          for item in items:
              legal_id = item.get("legal_id")
              if item.get("status") == "unmapped":
                  failures.append(f"{legal_id}: unmapped")
              elif item.get("status") == "comparable" and not item.get("tested"):
                  failures.append(f"{legal_id}: comparable but not covered by companion tests")

          if failures:
              print("Changed PolicyEngine oracle coverage is incomplete.", file=sys.stderr)
              for failure in failures[:50]:
                  print(f"- {failure}", file=sys.stderr)
              if len(failures) > 50:
                  print(f"- ... {len(failures) - 50} more", file=sys.stderr)
              sys.exit(1)

          print(f"Changed PolicyEngine oracle coverage passed for {len(items)} output(s).")
          PY

  validate-complete:
    # Matrix jobs get suffixed check names such as `validate (us-ca)`.
    # Keep this aggregate name as `validate` so existing branch-protection
    # rules requiring `validate / validate` have one stable context.
    name: validate
    needs: [shards, validate]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rules repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prove exact validation shard coverage
        shell: bash
        env:
          SHARD_MATRIX: ${{ needs.shards.outputs.matrix }}
          SHARD_DESCRIPTORS: ${{ needs.shards.outputs.descriptors }}
          SELECTED_ROOTS: ${{ needs.shards.outputs.selected-roots }}
          MAX_SHARD_MODULES: ${{ needs.shards.outputs.max-shard-modules }}
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import json
          import os
          from collections import defaultdict
          from pathlib import Path, PurePosixPath

          matrix = json.loads(os.environ["SHARD_MATRIX"])
          descriptors = json.loads(os.environ["SHARD_DESCRIPTORS"])
          selected_roots = os.environ["SELECTED_ROOTS"].split()
          maximum = int(os.environ["MAX_SHARD_MODULES"])

          def fail(message: str) -> None:
              raise SystemExit(f"ValidationShardCoverageError: {message}")

          def canonical_relative(value: object, *, allow_dot: bool = False) -> str:
              if not isinstance(value, str) or not value:
                  fail(f"non-string or empty relative path: {value!r}")
              if "\n" in value or "\r" in value:
                  fail(f"relative path contains CR or LF: {value!r}")
              if allow_dot and value == ".":
                  return value
              path = PurePosixPath(value)
              if (
                  path.is_absolute()
                  or value != path.as_posix()
                  or value.startswith("/")
                  or value.endswith("/")
                  or "\\" in value
                  or any(part in {"", ".", ".."} for part in path.parts)
              ):
                  fail(f"non-canonical or escaping relative path: {value!r}")
              return value

          if maximum <= 0:
              fail("max-shard-modules is not positive")
          if not isinstance(matrix, list) or not all(isinstance(item, str) for item in matrix):
              fail("matrix must be a list of shard identifiers")
          if len(matrix) != len(set(matrix)):
              fail("matrix contains duplicate shard identifiers")
          if not matrix or len(matrix) > 256:
              fail(f"matrix contains {len(matrix)} entries")
          if len(selected_roots) != len(set(selected_roots)) or not selected_roots:
              fail("selected roots are empty or duplicated")
          selected_roots = [canonical_relative(root) for root in selected_roots]
          for index, root in enumerate(selected_roots):
              for other in selected_roots[index + 1:]:
                  if root.startswith(other + "/") or other.startswith(root + "/"):
                      fail(f"selected roots overlap: {root!r} and {other!r}")

          if not isinstance(descriptors, list):
              fail("descriptors must be a list")
          descriptor_ids: list[str] = []
          for descriptor in descriptors:
              if not isinstance(descriptor, dict) or set(descriptor) != {
                  "filters", "id", "module_count", "root"
              }:
                  fail(f"malformed descriptor: {descriptor!r}")
              identifier = descriptor["id"]
              if not isinstance(identifier, str) or not identifier:
                  fail(f"invalid descriptor identifier: {identifier!r}")
              descriptor_ids.append(identifier)
              descriptor["root"] = canonical_relative(descriptor["root"])
              filters = descriptor["filters"]
              if not isinstance(filters, list) or not filters:
                  fail(f"{identifier}: descriptor has no filters")
              descriptor["filters"] = [
                  canonical_relative(item, allow_dot=True) for item in filters
              ]
              count = descriptor["module_count"]
              if not isinstance(count, int) or isinstance(count, bool) or count < 0:
                  fail(f"{identifier}: invalid module_count {count!r}")
              if count > maximum:
                  fail(
                      f"{identifier}: {count} modules exceeds max-shard-modules={maximum}"
                  )

          if descriptor_ids != matrix:
              fail("matrix identifiers and ordered descriptors differ")
          described_roots = {str(descriptor["root"]) for descriptor in descriptors}
          if described_roots != set(selected_roots):
              fail(
                  "descriptor roots differ from selected roots: "
                  f"{sorted(described_roots)} != {sorted(selected_roots)}"
              )

          def family(relative: PurePosixPath) -> PurePosixPath:
              text = relative.as_posix()
              if text.endswith(".test.yaml"):
                  return PurePosixPath(text.removesuffix(".test.yaml") + ".yaml")
              if text.endswith(".test.yml"):
                  return PurePosixPath(text.removesuffix(".test.yml") + ".yml")
              return relative

          modules_by_root: dict[str, set[str]] = {}
          families_by_root: dict[str, set[str]] = {}
          for root_text in selected_roots:
              root = Path(root_text)
              modules: set[str] = set()
              families: set[str] = set()
              if root.is_symlink():
                  fail(f"validation content root must not be a symlink: {root}")
              if root.is_dir():
                  for directory, directory_names, file_names in os.walk(
                      root, followlinks=False
                  ):
                      directory_names[:] = sorted(
                          name for name in directory_names if name != "programs"
                      )
                      base = Path(directory)
                      for name in sorted(file_names):
                          path = base / name
                          if path.is_symlink() or not path.is_file():
                              continue
                          relative = PurePosixPath(path.relative_to(root).as_posix())
                          if "programs" in relative.parts:
                              continue
                          if not (name.endswith(".yaml") or name.endswith(".yml")):
                              continue
                          module_family = family(relative).as_posix()
                          families.add(module_family)
                          if not (
                              name.endswith(".test.yaml") or name.endswith(".test.yml")
                          ):
                              modules.add(relative.as_posix())
              modules_by_root[root_text] = modules
              families_by_root[root_text] = families

          def matches(relative: str, selector: str) -> bool:
              return (
                  selector == "."
                  or relative == selector
                  or relative.startswith(selector + "/")
              )

          owners: dict[tuple[str, str], list[tuple[str, str]]] = defaultdict(list)
          observed_modules: dict[str, set[str]] = defaultdict(set)
          for descriptor in descriptors:
              identifier = str(descriptor["id"])
              root = str(descriptor["root"])
              families = families_by_root[root]
              for selector in descriptor["filters"]:
                  matched_families = {
                      item for item in families if matches(item, str(selector))
                  }
                  if not matched_families and families:
                      fail(f"{identifier}: filter {selector!r} owns no module family")
                  for item in matched_families:
                      owners[(root, item)].append((identifier, str(selector)))
                      if item in modules_by_root[root]:
                          observed_modules[identifier].add(item)

          coverage_errors: list[str] = []
          for root in selected_roots:
              for module_family in sorted(families_by_root[root]):
                  matches_found = owners[(root, module_family)]
                  if len(matches_found) != 1:
                      repo_path = f"{root}/{module_family}"
                      coverage_errors.append(
                          f"{repo_path}: expected exactly one shard filter, got "
                          f"{len(matches_found)} ({matches_found})"
                      )
          for descriptor in descriptors:
              identifier = str(descriptor["id"])
              expected = int(descriptor["module_count"])
              actual = len(observed_modules[identifier])
              if actual != expected:
                  coverage_errors.append(
                      f"{identifier}: declared {expected} modules but owns {actual}"
                  )

          if coverage_errors:
              for error in coverage_errors[:100]:
                  print(f"- {error}")
              if len(coverage_errors) > 100:
                  print(f"- ... {len(coverage_errors) - 100} more")
              fail(f"{len(coverage_errors)} exact-coverage violation(s)")

          module_total = sum(len(items) for items in modules_by_root.values())
          family_total = sum(len(items) for items in families_by_root.values())
          print(
              f"Exact shard coverage proved for {module_total} module(s), "
              f"{family_total} module family/families, and {len(descriptors)} shard(s)."
          )
          PY

      - name: Check validation matrix result
        shell: bash
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: |
          set -euo pipefail
          if [ "$VALIDATE_RESULT" != "success" ]; then
            echo "Validation matrix completed with result: $VALIDATE_RESULT" >&2
            exit 1
          fi
          echo "Validation matrix passed."
